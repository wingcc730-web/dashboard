<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>個人天氣與交通儀表板</title>
<style>
:root{--bg:#fdf6f5;--pink:#f06c88;--pink2:#f4b8c8;--teal:#008a87;--line:#ffebee}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.dashboard{max-width:1100px;margin:auto}.top-bar,.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 15px #00000008}.top-bar{border-style:dashed;border-color:var(--pink2);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top-bar-left{display:flex;align-items:center;gap:15px}.clock-time{font-size:3rem;font-weight:900;color:var(--teal)}.clock-date,.update-time{color:var(--pink);font-weight:bold}.badge{background:#ffe6e8;color:var(--pink);padding:8px 18px;border-radius:20px;font-weight:bold}.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px}.card-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:2px dashed var(--line);margin-bottom:20px}.card-title{font-size:1.3rem;font-weight:bold}.update-time{font-size:.85rem;background:#fff2f4;padding:4px 12px;border-radius:12px}.weather-main{display:flex;justify-content:space-between;align-items:center}.temp{font-size:5rem;font-weight:bold;color:#ffb300}.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.w{padding:14px;border-radius:12px;font-weight:bold;display:flex;justify-content:space-between}.forecast{display:flex;gap:10px;overflow:auto;border-top:2px dashed var(--line);padding-top:15px}.day{min-width:78px;text-align:center;background:#fafafa;border-radius:12px;padding:10px}.calendar{margin-top:20px;border-top:2px dashed var(--line);padding-top:15px}.calendar iframe{border:0;border-radius:12px}.bus-card{border:2px solid #f5f5f5;border-radius:16px;padding:15px;margin-bottom:15px}.bus-main{display:flex;align-items:center;gap:12px}.route{background:var(--teal);color:#fff;font-size:1.25rem;font-weight:bold;padding:6px 12px;border-radius:8px;white-space:nowrap}.route.lrt{background:#f39c12}.info{flex:1}.dest{font-weight:bold;font-size:1.05rem}.stop{font-size:.85rem;color:#e91e63}.eta{font-size:1.6rem;font-weight:bold;color:var(--teal);text-align:right}.tag,.pill{font-size:.9rem;background:#e6f6f4;color:var(--teal);padding:3px 7px;border-radius:7px}.sub{display:flex;gap:7px;flex-wrap:wrap;border-top:2px dashed #f5f5f5;margin-top:12px;padding-top:12px;color:#666}.pill{background:#f5f5f5;color:#555}.error{color:#c62828;font-size:.9rem}@media(max-width:800px){.grid{grid-template-columns:1fr}.top-bar{align-items:flex-start}.clock-time{font-size:2.2rem}.badge{display:none}.bus-main{align-items:flex-start}.eta{font-size:1.25rem}}
</style>
</head>
<body><div class="dashboard">
<header class="top-bar"><div class="top-bar-left"><div id="clock-time" class="clock-time">00:00:00</div><div id="clock-date" class="clock-date"></div></div><div class="badge">七夕 🌸</div></header>
<main class="grid">
<section class="card"><div class="card-header"><div class="card-title">☀️ 屯門天氣</div><div id="weather-time" class="update-time">更新時間：--:--</div></div>
<div class="weather-main"><div><div id="temp" class="temp">--°</div><b id="range">今日預測：--</b></div><div style="font-size:4rem">🌤️</div></div>
<div class="weather-grid"><div class="w" style="background:#e6f6f4">🌡️ 體感 <span id="feel">--</span></div><div class="w" style="background:#ffebee">☀️ UV <span id="uv">--</span></div><div class="w" style="background:#e3f2fd">💧 濕度 <span id="humidity">--</span></div><div class="w" style="background:#fff8e1">☂️ 降雨 <span id="rain">--</span></div></div>
<div id="forecast" class="forecast">載入中...</div>
<div class="calendar"><b>📅 Google 日曆行程</b><br><br><iframe src="https://calendar.google.com/calendar/embed?height=300&wkst=1&ctz=Asia%2FHong_Kong&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=1&mode=MONTH&src=dc89b4793ace2057fecdec46d4993dd5afe36ad943d15934b7b00a099a2d63f6%40group.calendar.google.com&color=%238E24AA&src=46b5edaa088a96fb4cf4a2ce028f4fad9be8c6225b65add94502c53809cf63df%40group.calendar.google.com&color=%233F51B5&src=f438bd70999c821aadcda50f018273bbf83a40495fca259c10d826477a34eaf1%40group.calendar.google.com&color=%230B8043" width="100%" height="280" loading="lazy"></iframe></div>
</section>
<section class="card"><div class="card-header"><div class="card-title">🚌 交通</div><div id="transport-time" class="update-time">更新時間：--:--</div></div><div id="transport">載入中...</div></section>
</main></div>
<script>
const HKO_RHR='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc';
const HKO_FND='https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc';
const KMB='https://data.etabus.gov.hk/v1/transport/kmb';
const MTR_BUS='https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule';
const MTR_LRT='https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule';
const routes=[
 {type:'KMB',route:'57M',dir:'O',dest:'荔景 (北)',stopName:'業旺邨'},
 {type:'KMB',route:'66X',dir:'O',dest:'奧運站',stopName:'聖彼得堂'},
 {type:'KMB',route:'66M',dir:'O',dest:'荃灣 (如心廣場)',stopName:'聖彼得堂'},
 {type:'KMB',route:'258D',dir:'O',dest:'藍田站',stopName:'聖彼得堂'},
 {type:'MTR',route:'K53S',dest:'屯門站',stopName:'業旺邨'},
 {type:'LRT',route:'輕鐵',dest:'元朗',stationId:'040',stopName:'青山村'}
];
function tick(){const n=new Date(),p=x=>String(x).padStart(2,'0');clock_time.textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;clock_date.textContent=`${n.getMonth()+1}月${n.getDate()}日 (${['日','一','二','三','四','五','六'][n.getDay()]}) 🌸`}const clock_time=document.getElementById('clock-time'),clock_date=document.getElementById('clock-date');tick();setInterval(tick,1000);
const hm=()=>new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'});const etaClock=s=>{const d=new Date(Date.now()+s*1000);return d.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})};
async function weather(){try{const[a,b]=await Promise.all([fetch(HKO_RHR),fetch(HKO_FND)]);if(!a.ok||!b.ok)throw Error('HTTP error');const r=await a.json(),f=await b.json(),t=r.temperature.data.find(x=>x.place==='屯門')?.value??r.temperature.data[0]?.value;temp.textContent=`${t}°`;feel.textContent=`${(Number(t)+2.5).toFixed(1)}°C`;humidity.textContent=`${r.humidity.data[0]?.value??'--'}%`;uv.textContent=r.uvindex?.data?.[0]?.value??'--';const d=f.weatherForecast[0];range.textContent=`今日預測：${d.forecastMintemp.value}°C - ${d.forecastMaxtemp.value}°C`;rain.textContent=d.PSR||'--';forecast.innerHTML=f.weatherForecast.slice(0,7).map(x=>`<div class="day"><b>${x.forecastDate.slice(6,8)}/${x.forecastDate.slice(4,6)}</b><div style="font-size:1.6rem">🌤️</div>${x.forecastMintemp.value}°-${x.forecastMaxtemp.value}°</div>`).join('');document.getElementById('weather-time').textContent=`更新時間：${hm()}`}catch(e){forecast.innerHTML='<span class="error">暫時未能取得天氣資料</span>';console.error(e)}}
async function kmbStop(route,dir,name){const bound=dir==='O'?'outbound':'inbound',r=await fetch(`${KMB}/route-stop/${route}/${bound}/1`),j=await r.json(),rows=j.data||[],key=name.includes('業旺')?'業旺':name.includes('聖彼')?'聖彼':name;return rows.find(x=>(x.name_tc||'').includes(key))?.stop||null}
function normalize(seconds){const s=Number(seconds);if(!Number.isFinite(s)||s<0||s>=108000)return null;return{mins:Math.max(0,Math.floor(s/60)),time:etaClock(s)}}
async function mtrK53S(){
 // 重要：港鐵 API 必須送出 routeName。先查 K53S；若後端尚未更新則回退查 K53。
 for(const apiRoute of ['K53S','K53']){
  const r=await fetch(MTR_BUS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:'zh',routeName:apiRoute})});
  if(!r.ok)continue;const j=await r.json();if(!Array.isArray(j.busStop)||!j.busStop.length)continue;
  // API 沒有 busStopName / routeList。K53S 是循環線，業旺邨通常是回程前一站；以有資料的中間站優先。
  const candidates=j.busStop.filter(s=>Array.isArray(s.bus)&&s.bus.length);
  const stop=candidates.find(s=>/K53S?.*(D|R).*0?3/i.test(s.busStopId||''))||candidates.at(-2)||candidates[0];
  const list=(stop?.bus||[]).map(x=>normalize(x.arrivalTimeInSecond)).filter(Boolean).sort((a,b)=>a.mins-b.mins);
  if(list.length)return list;
 }
 return [];
}
async function getEtas(bus){if(bus.type==='KMB'){const id=await kmbStop(bus.route,bus.dir,bus.stopName);if(!id)return[];const r=await fetch(`${KMB}/eta/${id}/${bus.route}/1`),j=await r.json();return(j.data||[]).filter(x=>x.dir===bus.dir&&x.eta).map(x=>{const s=(new Date(x.eta)-Date.now())/1000;return normalize(s)}).filter(Boolean).sort((a,b)=>a.mins-b.mins)}if(bus.type==='MTR')return mtrK53S();if(bus.type==='LRT'){const r=await fetch(`${MTR_LRT}?station_id=${bus.stationId}`),j=await r.json(),out=[];(j.platform_list||[]).forEach(p=>(p.route_list||[]).forEach(x=>{if((x.dest_ch||'').includes(bus.dest)){const m=(x.time_ch||'').match(/\d+/);const mins=m?Number(m[0]):/(即將|正在)/.test(x.time_ch||'')?0:null;if(mins!==null)out.push({mins,time:etaClock(mins*60),routeNo:x.route_no})}}));return out.sort((a,b)=>a.mins-b.mins)}return[]}
function card(bus,list){const first=list[0],title=bus.type==='LRT'&&first?.routeNo?`輕鐵 ${first.routeNo}`:bus.route,main=first?`${first.mins===0?'即將':first.mins+' 分鐘'} <span class="tag">${first.time}</span>`:'<span style="color:#999;font-size:1rem">暫時未能讀取</span>',subs=list.slice(1,4).map(x=>`<span class="pill">${x.routeNo?x.routeNo+'線: ':''}${x.mins}分 (${x.time})</span>`).join('')||'<span>沒有後續班次（或非服務時間）</span>';return `<div class="bus-card"><div class="bus-main"><div class="route ${bus.type==='LRT'?'lrt':''}">${title}</div><div class="info"><div class="dest">往 ${bus.dest}</div><div class="stop">📍 ${bus.stopName}</div></div><div class="eta">${main}</div></div><div class="sub"><span>後續班次：</span>${subs}</div></div>`}
let loading=false;async function transport(){if(loading)return;loading=true;try{const results=await Promise.all(routes.map(async b=>({b,list:await getEtas(b).catch(e=>(console.error(b.route,e),[]))})));document.getElementById('transport').innerHTML=results.map(x=>card(x.b,x.list)).join('');document.getElementById('transport-time').textContent=`更新時間：${hm()}`}finally{loading=false}}
weather();transport();setInterval(weather,60000);setInterval(transport,30000);
</script></body></html>
