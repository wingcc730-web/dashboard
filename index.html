<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="資訊板">
    <meta name="theme-color" content="#fdf6f5">

    <title>個人天氣與交通儀表板</title>

    <link rel="preconnect" href="https://data.weather.gov.hk">
    <link rel="preconnect" href="https://data.etabus.gov.hk">
    <link rel="preconnect" href="https://rt.data.gov.hk">
    <link rel="preconnect" href="https://calendar.google.com">

    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --card-border: #ffebee;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-main);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: var(--bg-main);
            color: #333;
            margin: 0;

            padding-top: max(20px, var(--safe-top));
            padding-right: max(20px, var(--safe-right));
            padding-bottom: max(20px, var(--safe-bottom));
            padding-left: max(20px, var(--safe-left));

            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 頂部標題列 */

        .top-bar {
            background-color: #ffffff;
            border: 2px dashed var(--pink-border);
            border-radius: 20px;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;

            box-shadow:
                0 4px 10px
                rgba(255, 230, 232, 0.5);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .clock-time {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--teal-main);
            font-family: "Arial Black", Arial, sans-serif;
            letter-spacing: 2px;
            line-height: 1;
            white-space: nowrap;
        }

        .clock-date {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--pink-text);
            white-space: nowrap;
        }

        .badge-qixi {
            background-color: var(--pink-bg);
            color: var(--pink-text);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            white-space: nowrap;

            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 內容網格 */

        .content-grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(0, 0.85fr);

            gap: 20px;
            align-items: start;
        }

        /* 卡片 */

        .card {
            background-color: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.02);

            min-width: 0;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            padding-bottom: 15px;
            border-bottom: 2px dashed var(--card-border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;
        }

        .weather-label {
            font-size: 0.8rem;
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 12px;
            margin-left: 10px;
            white-space: nowrap;
        }

        .update-time {
            font-size: 0.85rem;
            color: #f06c88;
            background-color: #fff2f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 天氣 */

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .temp-large {
            font-size: 5rem;
            font-weight: bold;
            color: #ffb300;
            line-height: 1;
        }

        .temp-range {
            font-size: 0.95rem;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }

        .weather-icon-large {
            font-size: 4.5rem;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .w-item {
            padding: 15px;
            border-radius: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;

            font-weight: bold;
            font-size: 1.1rem;
        }

        .w-item.apparent {
            background: #e6f6f4;
            color: var(--teal-main);
        }

        .w-item.uv {
            background: #ffebee;
            color: #d81b60;
        }

        .w-item.humidity {
            background: #e3f2fd;
            color: #1976d2;
        }

        .w-item.rain {
            background: #fff8e1;
            color: #673ab7;
        }

        .w-item span {
            color: #333;
        }

        /* 天氣預報 */

        .forecast-section {
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }

        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-container {
            display: flex;
            gap: 12px;

            overflow-x: auto;
            overflow-y: hidden;

            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .forecast-day {
            flex: 0 0 auto;
            text-align: center;
            background: #fcfcfc;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            min-width: 75px;
        }

        .forecast-day .date {
            font-size: 0.85rem;
            color: #333;
            font-weight: bold;
        }

        .forecast-day .icon {
            font-size: 1.6rem;
            margin: 6px 0;
        }

        .forecast-day .temp {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
        }

        /* Google Calendar */

        .calendar-section {
            margin-top: 20px;
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }

        .calendar-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            background: #fff;
        }

        .calendar-wrapper iframe {
            display: block;
            width: 100%;
            height: 280px;
            border: 0;
        }

        /* 交通 */

        .bus-card {
            border: 2px solid #f5f5f5;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .bus-card:last-child {
            margin-bottom: 0;
        }

        .bus-main {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            min-width: 0;
        }

        .bus-route-box {
            background-color: var(--teal-main);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .bus-route-box.lrt-box {
            background-color: #f39c12;
        }

        .bus-info {
            flex-grow: 1;
            min-width: 0;
        }

        .bus-dest {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }

        .bus-stop {
            font-size: 0.85rem;
            color: #e91e63;
            margin-top: 4px;
        }

        .bus-eta-group {
            text-align: right;
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .bus-eta-main {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--teal-main);
            white-space: nowrap;
        }

        .eta-time-tag {
            background-color: #e6f6f4;
            color: var(--teal-main);
            font-size: 0.95rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
        }

        .bus-sub {
            border-top: 2px dashed #f5f5f5;
            padding-top: 12px;
            font-size: 0.95rem;
            color: #666;

            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sub-pill {
            background-color: #f5f5f5;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .loading-message {
            color: #999;
            font-size: 0.9rem;
        }

        /* 捲軸 */

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #eedddf;
            border-radius: 10px;
        }

        /* 一般手機直向 */

        @media only screen and (max-width: 800px) {
            body {
                padding-top: max(10px, var(--safe-top));
                padding-right: max(10px, var(--safe-right));
                padding-bottom: max(10px, var(--safe-bottom));
                padding-left: max(10px, var(--safe-left));
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .top-bar {
                padding: 14px;
                margin-bottom: 12px;
            }

            .clock-time {
                font-size: 2.2rem;
            }

            .clock-date {
                font-size: 0.95rem;
            }

            .badge-qixi {
                display: none;
            }

            .card {
                padding: 14px;
                margin-bottom: 12px;
            }

            .weather-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .bus-eta-main {
                font-size: 1.3rem;
            }
        }

        /* iPhone 橫向資訊板模式 */

        @media only screen
            and (orientation: landscape)
            and (max-height: 500px) {

            html {
                font-size: 13px;
            }

            body {
                padding-top: max(6px, var(--safe-top));
                padding-right: max(8px, var(--safe-right));
                padding-bottom: max(8px, var(--safe-bottom));
                padding-left: max(8px, var(--safe-left));
            }

            .dashboard {
                max-width: none;
            }

            .top-bar {
                padding: 7px 14px;
                margin-bottom: 8px;
                border-radius: 14px;
            }

            .top-bar-left {
                gap: 10px;
            }

            .clock-time {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            .clock-date {
                font-size: 0.82rem;
            }

            .badge-qixi {
                display: flex;
                font-size: 0.8rem;
                padding: 5px 10px;
            }

            .content-grid {
                grid-template-columns:
                    minmax(0, 1.05fr)
                    minmax(0, 0.95fr);

                gap: 8px;
            }

            .card {
                padding: 9px;
                border-radius: 14px;
                margin-bottom: 8px;
            }

            .card-header {
                padding-bottom: 7px;
                margin-bottom: 8px;
            }

            .card-title {
                font-size: 1rem;
                gap: 4px;
            }

            .weather-label {
                font-size: 0.65rem;
                padding: 3px 6px;
                margin-left: 3px;
            }

            .update-time {
                font-size: 0.65rem;
                padding: 3px 6px;
            }

            .weather-main {
                margin-bottom: 8px;
            }

            .temp-large {
                font-size: 3rem;
            }

            .temp-range {
                font-size: 0.72rem;
                margin-top: 4px;
            }

            .weather-icon-large {
                font-size: 2.8rem;
            }

            .weather-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                margin-bottom: 8px;
            }

            .w-item {
                padding: 7px;
                border-radius: 8px;
                font-size: 0.72rem;
            }

            .forecast-section {
                padding-top: 7px;
            }

            .forecast-header {
                font-size: 0.72rem;
                margin-bottom: 6px;
            }

            .forecast-container {
                gap: 5px;
                padding-bottom: 4px;
            }

            .forecast-day {
                min-width: 55px;
                padding: 5px;
                border-radius: 8px;
            }

            .forecast-day .date {
                font-size: 0.66rem;
            }

            .forecast-day .icon {
                font-size: 1.05rem;
                margin: 2px 0;
            }

            .forecast-day .temp {
                font-size: 0.64rem;
            }

            .calendar-section {
                margin-top: 8px;
                padding-top: 7px;
            }

            .calendar-section .forecast-header {
                margin-bottom: 5px;
            }

            .calendar-wrapper iframe {
                height: 170px;
            }

            .bus-card {
                padding: 7px;
                margin-bottom: 5px;
                border-radius: 10px;
            }

            .bus-main {
                margin-bottom: 5px;
            }

            .bus-route-box {
                font-size: 0.88rem;
                padding: 4px 7px;
                border-radius: 6px;
                margin-right: 7px;
            }

            .bus-dest {
                font-size: 0.75rem;
            }

            .bus-stop {
                font-size: 0.62rem;
                margin-top: 2px;
            }

            .bus-eta-main {
                font-size: 0.92rem;
            }

            .eta-time-tag {
                font-size: 0.64rem;
                padding: 2px 4px;
            }

            .bus-sub {
                padding-top: 5px;
                font-size: 0.62rem;
                gap: 4px;
            }

            .sub-pill {
                padding: 2px 5px;
                font-size: 0.61rem;
            }
        }
    </style>
</head>

<body>

<div class="dashboard">

    <header class="top-bar">
        <div class="top-bar-left">
            <div class="clock-time" id="clock-time">
                00:00:00
            </div>

            <div class="clock-date" id="clock-date">
                --月--日 (-) 🌸
            </div>
        </div>

        <div class="top-bar-right">
            <div class="badge-qixi">
                七月初七 ✨ 七夕 🌸
            </div>
        </div>
    </header>

    <main class="content-grid">

        <section class="card">

            <div class="card-header">
                <div class="card-title">
                    ☀️ 屯門

                    <span class="weather-label">
                        🎐 天氣資訊
                    </span>
                </div>

                <div
                    class="update-time"
                    id="weather-update-time"
                >
                    更新時間 : --:--
                </div>
            </div>

            <div class="weather-main">
                <div>
                    <div
                        class="temp-large"
                        id="current-temp"
                    >
                        --°
                    </div>

                    <div
                        class="temp-range"
                        id="temp-range"
                    >
                        今日預測 : --°C - --°C
                    </div>
                </div>

                <div
                    class="weather-icon-large"
                    id="main-weather-icon"
                >
                    🌧️
                </div>
            </div>

            <div class="weather-grid">

                <div class="w-item apparent">
                    <span>🌡️ 體感溫度</span>
                    <span id="apparent-temp">--°C</span>
                </div>

                <div class="w-item uv">
                    <span>☀️ 紫外線指數</span>
                    <span id="current-uv">--</span>
                </div>

                <div class="w-item humidity">
                    <span>💧 相對濕度</span>
                    <span id="current-humidity">--%</span>
                </div>

                <div class="w-item rain">
                    <span>☂️ 降雨概率</span>
                    <span id="rain-prob">--%</span>
                </div>

            </div>

            <div class="forecast-section">

                <div class="forecast-header">
                    <div>未來七天天氣預測</div>

                    <div style="font-size:0.8rem; color:#999;">
                        天文台自動數據
                    </div>
                </div>

                <div
                    id="forecast-container"
                    class="forecast-container"
                >
                    <div class="loading-message">
                        載入中...
                    </div>
                </div>

            </div>

            <div class="calendar-section">

                <div class="forecast-header">
                    <div>📅 Google 日曆行程</div>
                </div>

                <div class="calendar-wrapper">
                    <iframe
                        src="https://calendar.google.com/calendar/embed?height=300&wkst=1&ctz=Asia%2FHong_Kong&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=1&mode=MONTH&src=dc89b4793ace2057fecdec46d4993dd5afe36ad943d15934b7b00a099a2d63f6%40group.calendar.google.com&color=%238E24AA&src=46b5edaa088a96fb4cf4a2ce028f4fad9be8c6225b65add94502c53809cf63df%40group.calendar.google.com&color=%233F51B5&src=f438bd70999c821aadcda50f018273bbf83a40495fca259c10d826477a34eaf1%40group.calendar.google.com&color=%230B8043"
                        width="100%"
                        height="280"
                        frameborder="0"
                        scrolling="no"
                        loading="lazy"
                        title="Google 日曆行程"
                    ></iframe>
                </div>

            </div>

        </section>

        <section class="card">

            <div class="card-header">
                <div class="card-title">
                    🚌 交通
                </div>

                <div
                    class="update-time"
                    id="transport-update-time"
                >
                    更新時間 : --:--
                </div>
            </div>

            <div id="transport-container">
                <div class="loading-message">
                    載入中...
                </div>
            </div>

        </section>

    </main>

</div>

<script>
    "use strict";

    function getCurrentTimeText() {
        return new Date().toLocaleTimeString(
            "zh-HK",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }

    function getEtaClockTime(seconds) {
        const etaDate =
            new Date(
                Date.now() +
                seconds * 1000
            );

        return (
            String(
                etaDate.getHours()
            ).padStart(2, "0") +
            ":" +
            String(
                etaDate.getMinutes()
            ).padStart(2, "0")
        );
    }

    /* 時鐘及日期 */

    function updateClock() {
        const now = new Date();

        const hh =
            String(
                now.getHours()
            ).padStart(2, "0");

        const mm =
            String(
                now.getMinutes()
            ).padStart(2, "0");

        const ss =
            String(
                now.getSeconds()
            ).padStart(2, "0");

        document.getElementById(
            "clock-time"
        ).textContent =
            `${hh}:${mm}:${ss}`;

        const days = [
            "日",
            "一",
            "二",
            "三",
            "四",
            "五",
            "六"
        ];

        document.getElementById(
            "clock-date"
        ).textContent =
            `${now.getMonth() + 1}月` +
            `${now.getDate()}日 ` +
            `(${days[now.getDay()]}) 🌸`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    /* 天氣 */

    const HKO_RHRREAD =
        "https://data.weather.gov.hk/weatherAPI/opendata/" +
        "weather.php?dataType=rhrread&lang=tc";

    const HKO_FND =
        "https://data.weather.gov.hk/weatherAPI/opendata/" +
        "weather.php?dataType=fnd&lang=tc";

    let weatherIsLoading = false;

    function getWeatherIcon(iconCode) {
        const icons = {
            1: "☀️",
            2: "🌤️",
            3: "⛅",
            4: "☁️",
            5: "🌥️",
            6: "🌧️",
            7: "🌩️",
            8: "⛈️",
            9: "🌫️"
        };

        return icons[iconCode] || "🌤️";
    }

    async function fetchWeather() {
        if (weatherIsLoading) {
            return;
        }

        weatherIsLoading = true;

        try {
            const responses =
                await Promise.all([
                    fetch(
                        HKO_RHRREAD,
                        {
                            cache: "no-store"
                        }
                    ),
                    fetch(
                        HKO_FND,
                        {
                            cache: "no-store"
                        }
                    )
                ]);

            if (
                !responses[0].ok ||
                !responses[1].ok
            ) {
                throw new Error(
                    "天氣 API HTTP 錯誤"
                );
            }

            const values =
                await Promise.all([
                    responses[0].json(),
                    responses[1].json()
                ]);

            const dataRhr = values[0];
            const dataFnd = values[1];

            const tmTemp =
                dataRhr.temperature.data.find(
                    item =>
                        item.place === "屯門"
                )?.value ??
                dataRhr.temperature.data[0]?.value;

            document.getElementById(
                "current-temp"
            ).textContent =
                `${tmTemp}°`;

            document.getElementById(
                "apparent-temp"
            ).textContent =
                `${(Number(tmTemp) + 2.5).toFixed(1)}°C`;

            document.getElementById(
                "current-humidity"
            ).textContent =
                `${dataRhr.humidity.data[0]?.value ?? "--"}%`;

            const uv =
                dataRhr.uvindex?.data?.[0]?.value ??
                "--";

            const uvDesc =
                dataRhr.uvindex?.data?.[0]?.desc ??
                "";

            document.getElementById(
                "current-uv"
            ).textContent =
                `${uv}${uvDesc ? " · " + uvDesc : ""}`;

            const today =
                dataFnd.weatherForecast[0];

            document.getElementById(
                "temp-range"
            ).textContent =
                `今日預測 : ` +
                `${today.forecastMintemp.value}°C - ` +
                `${today.forecastMaxtemp.value}°C`;

            document.getElementById(
                "rain-prob"
            ).textContent =
                `${today.PSR || "低"}`;

            document.getElementById(
                "main-weather-icon"
            ).textContent =
                getWeatherIcon(
                    today.ForecastIcon
                );

            const forecastHTML =
                dataFnd.weatherForecast
                .slice(0, 7)
                .map(day => {
                    const dateText =
                        day.forecastDate.substring(6, 8) +
                        "/" +
                        day.forecastDate.substring(4, 6);

                    const weekText =
                        day.week.substring(2, 3);

                    return `
                        <div class="forecast-day">
                            <div class="date">
                                ${dateText}(${weekText})
                            </div>

                            <div class="icon">
                                ${getWeatherIcon(day.ForecastIcon)}
                            </div>

                            <div class="temp">
                                ${day.forecastMintemp.value}°-${day.forecastMaxtemp.value}°
                            </div>
                        </div>
                    `;
                })
                .join("");

            document.getElementById(
                "forecast-container"
            ).innerHTML =
                forecastHTML;

            document.getElementById(
                "weather-update-time"
            ).textContent =
                `更新時間 : ${getCurrentTimeText()}`;

        } catch (error) {
            console.error(
                "天氣獲取失敗",
                error
            );

            document.getElementById(
                "forecast-container"
            ).innerHTML =
                `<div class="loading-message">` +
                `暫時未能取得預測。` +
                `</div>`;

        } finally {
            weatherIsLoading = false;
        }
    }

    /* 交通 */

    const KMB_BASE =
        "https://data.etabus.gov.hk/v1/transport/kmb";

    const MTR_BUS_BASE =
        "https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule";

    const MTR_LRT_BASE =
        "https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule";

    const busRoutes = [
        {
            type: "KMB",
            route: "57M",
            dir: "O",
            dest: "荔景 (北)",
            stopName: "業旺邨"
        },
        {
            type: "KMB",
            route: "66X",
            dir: "O",
            dest: "奧運站",
            stopName: "聖彼得堂"
        },
        {
            type: "KMB",
            route: "66M",
            dir: "O",
            dest: "荃灣 (如心廣場)",
            stopName: "聖彼得堂"
        },
        {
            type: "KMB",
            route: "258D",
            dir: "O",
            dest: "藍田站",
            stopName: "聖彼得堂"
        },
        {
            type: "MTR",
            route: "K53S",
            dest: "屯門站",
            stopName: "業旺邨"
        },
        {
            type: "LRT",
            route: "輕鐵",
            dest: "元朗",
            stationId: "040",
            stopName: "青山村"
        }
    ];

    let transportIsLoading = false;
    let kmbStopListPromise = null;

    const KMB_CACHE_KEY =
        "dashboard_kmb_stop_ids_v3";

    function readStopCache() {
        try {
            return JSON.parse(
                localStorage.getItem(
                    KMB_CACHE_KEY
                ) || "{}"
            );
        } catch (error) {
            return {};
        }
    }

    function saveStopCache(cache) {
        try {
            localStorage.setItem(
                KMB_CACHE_KEY,
                JSON.stringify(cache)
            );
        } catch (error) {
            console.warn(
                "未能儲存站點快取",
                error
            );
        }
    }

    const stopIdCache =
        readStopCache();

    async function getKmbStopList() {
        if (kmbStopListPromise) {
            return kmbStopListPromise;
        }

        kmbStopListPromise =
            fetch(
                `${KMB_BASE}/stop`,
                {
                    cache: "force-cache"
                }
            )
            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        `KMB Stop HTTP ${response.status}`
                    );
                }

                return response.json();
            })
            .then(data => {
                const map = new Map();

                (data.data || []).forEach(
                    item => {
                        map.set(
                            item.stop,
                            item
                        );
                    }
                );

                return map;
            })
            .catch(error => {
                kmbStopListPromise = null;
                throw error;
            });

        return kmbStopListPromise;
    }

    async function getKmbStopId(
        route,
        dir,
        targetName
    ) {
        const key =
            `${route}_${dir}_${targetName}`;

        if (stopIdCache[key]) {
            return stopIdCache[key];
        }

        try {
            const apiDir =
                dir === "O"
                    ? "outbound"
                    : "inbound";

            const values =
                await Promise.all([
                    fetch(
                        `${KMB_BASE}/route-stop/` +
                        `${encodeURIComponent(route)}/` +
                        `${apiDir}/1`,
                        {
                            cache: "force-cache"
                        }
                    ),
                    getKmbStopList()
                ]);

            if (!values[0].ok) {
                throw new Error(
                    `KMB Route Stop HTTP ` +
                    `${values[0].status}`
                );
            }

            const routeData =
                await values[0].json();

            const stopMap =
                values[1];

            let matchText = targetName;

            if (
                targetName.includes("業旺")
            ) {
                matchText = "業旺";
            } else if (
                targetName.includes("聖彼得")
            ) {
                matchText = "聖彼得";
            }

            const matched =
                (routeData.data || [])
                .find(item => {
                    const stop =
                        stopMap.get(
                            item.stop
                        );

                    return (
                        stop?.name_tc || ""
                    ).includes(matchText);
                });

            if (!matched?.stop) {
                return null;
            }

            stopIdCache[key] =
                matched.stop;

            saveStopCache(
                stopIdCache
            );

            return matched.stop;

        } catch (error) {
            console.error(
                `九巴 ${route} 尋找站點失敗`,
                error
            );

            return null;
        }
    }

    function formatEtaTime(etaValue) {
        const date =
            new Date(etaValue);

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {
            return "";
        }

        return (
            String(
                date.getHours()
            ).padStart(2, "0") +
            ":" +
            String(
                date.getMinutes()
            ).padStart(2, "0")
        );
    }

    async function fetchKmbEtas(bus) {
        try {
            const stopId =
                await getKmbStopId(
                    bus.route,
                    bus.dir,
                    bus.stopName
                );

            if (!stopId) {
                return [];
            }

            const response =
                await fetch(
                    `${KMB_BASE}/eta/` +
                    `${encodeURIComponent(stopId)}/` +
                    `${encodeURIComponent(bus.route)}/1`,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `KMB ETA HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            const now =
                Date.now();

            return (data.data || [])
                .filter(item => {
                    return (
                        String(
                            item.route || ""
                        ).toUpperCase() ===
                        bus.route.toUpperCase() &&
                        (!item.dir ||
                            item.dir === bus.dir) &&
                        item.eta
                    );
                })
                .map(item => {
                    const etaTime =
                        new Date(
                            item.eta
                        ).getTime();

                    if (
                        !Number.isFinite(
                            etaTime
                        )
                    ) {
                        return null;
                    }

                    const difference =
                        etaTime - now;

                    if (
                        difference < -60000
                    ) {
                        return null;
                    }

                    return {
                        mins: Math.max(
                            0,
                            Math.floor(
                                difference /
                                60000
                            )
                        ),
                        timeStr:
                            formatEtaTime(
                                item.eta
                            )
                    };
                })
                .filter(Boolean)
                .sort(
                    (a, b) =>
                        a.mins -
                        b.mins
                )
                .slice(0, 3);

        } catch (error) {
            console.error(
                `九巴 ${bus.route} ETA 失敗`,
                error
            );

            return [];
        }
    }

    async function fetchMtrBusEtas(bus) {
        try {
            const response =
                await fetch(
                    MTR_BUS_BASE,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            language: "zh",
                            routeName: bus.route
                        }),
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `MTR Bus HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            const targetStop =
                data.busStop?.[2];

            if (
                !Array.isArray(
                    targetStop?.bus
                )
            ) {
                return [];
            }

            return targetStop.bus
                .map(item => {
                    const seconds =
                        Number(
                            item.arrivalTimeInSecond
                        );

                    if (
                        !Number.isFinite(seconds) ||
                        seconds < 0 ||
                        seconds >= 108000
                    ) {
                        return null;
                    }

                    return {
                        mins: Math.max(
                            0,
                            Math.floor(
                                seconds / 60
                            )
                        ),
                        timeStr:
                            getEtaClockTime(
                                seconds
                            )
                    };
                })
                .filter(Boolean)
                .sort(
                    (a, b) =>
                        a.mins -
                        b.mins
                )
                .slice(0, 3);

        } catch (error) {
            console.error(
                "K53S 讀取失敗",
                error
            );

            return [];
        }
    }

    async function fetchLrtEtas(bus) {
        try {
            const response =
                await fetch(
                    `${MTR_LRT_BASE}` +
                    `?station_id=` +
                    `${encodeURIComponent(bus.stationId)}`,
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    `LRT HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            const results = [];

            (data.platform_list || [])
                .forEach(platform => {
                    (platform.route_list || [])
                        .forEach(routeInfo => {
                            if (
                                !routeInfo.dest_ch?.includes(
                                    bus.dest
                                )
                            ) {
                                return;
                            }

                            const timeText =
                                routeInfo.time_ch || "";

                            let mins = null;
                            let minsText = timeText;

                            if (
                                timeText.includes(
                                    "分鐘"
                                )
                            ) {
                                mins =
                                    parseInt(
                                        timeText,
                                        10
                                    );
                            } else if (
                                timeText.includes(
                                    "即將"
                                ) ||
                                timeText.includes(
                                    "正在"
                                )
                            ) {
                                mins = 0;
                                minsText =
                                    "即將到站";
                            }

                            if (
                                !Number.isFinite(
                                    mins
                                )
                            ) {
                                return;
                            }

                            results.push({
                                routeNo:
                                    routeInfo.route_no,
                                mins,
                                minsText,
                                timeStr:
                                    getEtaClockTime(
                                        mins * 60
                                    )
                            });
                        });
                });

            return results
                .sort(
                    (a, b) =>
                        a.mins -
                        b.mins
                )
                .slice(0, 3);

        } catch (error) {
            console.error(
                "輕鐵讀取失敗",
                error
            );

            return [];
        }
    }

    function createTransportCard(
        bus,
        etas
    ) {
        let displayRoute =
            bus.route;

        let routeClass =
            "bus-route-box";

        let mainHTML =
            `<span style="` +
            `font-size:1.05rem;` +
            `color:#999;` +
            `">暫時未能讀取</span>`;

        let subHTML =
            `<span>` +
            `沒有後續班次 ` +
            `(或非服務時間)` +
            `</span>`;

        if (
            bus.type === "LRT"
        ) {
            routeClass +=
                " lrt-box";
        }

        if (etas.length > 0) {
            const first = etas[0];

            if (
                bus.type === "LRT"
            ) {
                displayRoute =
                    `輕鐵 ${first.routeNo}`;

                mainHTML =
                    `${first.minsText} ` +
                    `<span class="eta-time-tag">` +
                    `${first.timeStr}` +
                    `</span>`;

                if (etas.length > 1) {
                    subHTML =
                        etas.slice(1)
                        .map(item => {
                            return (
                                `<div class="sub-pill">` +
                                `${item.routeNo}線: ` +
                                `${item.minsText} ` +
                                `(${item.timeStr})` +
                                `</div>`
                            );
                        })
                        .join("");
                }
            } else {
                const firstText =
                    first.mins === 0
                        ? "即將"
                        : `${first.mins} 分鐘`;

                mainHTML =
                    `${firstText} ` +
                    `<span class="eta-time-tag">` +
                    `${first.timeStr}` +
                    `</span>`;

                if (etas.length > 1) {
                    subHTML =
                        etas.slice(1)
                        .map(item => {
                            return (
                                `<div class="sub-pill">` +
                                `${item.mins}分 ` +
                                `(${item.timeStr})` +
                                `</div>`
                            );
                        })
                        .join("");
                }
            }
        }

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "bus-card";

        card.innerHTML = `
            <div class="bus-main">
                <div class="${routeClass}">
                    ${displayRoute}
                </div>

                <div class="bus-info">
                    <div class="bus-dest">
                        往 ${bus.dest}
                    </div>

                    <div class="bus-stop">
                        📍 ${bus.stopName}
                    </div>
                </div>

                <div class="bus-eta-group">
                    <div class="bus-eta-main">
                        ${mainHTML}
                    </div>
                </div>
            </div>

            <div class="bus-sub">
                <span>後續班次：</span>
                ${subHTML}
            </div>
        `;

        return card;
    }

    async function fetchTransport() {
        if (transportIsLoading) {
            return;
        }

        transportIsLoading = true;

        const container =
            document.getElementById(
                "transport-container"
            );

        try {
            const results =
                await Promise.all(
                    busRoutes.map(
                        async bus => {
                            let etas = [];

                            try {
                                if (
                                    bus.type === "KMB"
                                ) {
                                    etas =
                                        await fetchKmbEtas(
                                            bus
                                        );
                                } else if (
                                    bus.type === "MTR"
                                ) {
                                    etas =
                                        await fetchMtrBusEtas(
                                            bus
                                        );
                                } else {
                                    etas =
                                        await fetchLrtEtas(
                                            bus
                                        );
                                }
                            } catch (error) {
                                console.error(
                                    `${bus.route} 更新失敗`,
                                    error
                                );
                            }

                            return {
                                bus,
                                etas
                            };
                        }
                    )
                );

            const fragment =
                document.createDocumentFragment();

            results.forEach(
                result => {
                    fragment.appendChild(
                        createTransportCard(
                            result.bus,
                            result.etas
                        )
                    );
                }
            );

            container.replaceChildren(
                fragment
            );

            document.getElementById(
                "transport-update-time"
            ).textContent =
                `更新時間 : ${getCurrentTimeText()}`;

        } catch (error) {
            console.error(
                "交通獲取失敗",
                error
            );

            container.innerHTML =
                `<div class="loading-message">` +
                `暫時未能取得交通資料。` +
                `</div>`;

        } finally {
            transportIsLoading = false;
        }
    }

    /* 更新排程 */

    let weatherTimer = null;
    let transportTimer = null;

    function startTimers() {
        if (!weatherTimer) {
            weatherTimer =
                setInterval(
                    fetchWeather,
                    60000
                );
        }

        if (!transportTimer) {
            transportTimer =
                setInterval(
                    fetchTransport,
                    30000
                );
        }
    }

    function stopTimers() {
        if (weatherTimer) {
            clearInterval(
                weatherTimer
            );

            weatherTimer = null;
        }

        if (transportTimer) {
            clearInterval(
                transportTimer
            );

            transportTimer = null;
        }
    }

    document.addEventListener(
        "visibilitychange",
        function () {
            if (
                document.visibilityState ===
                "visible"
            ) {
                fetchWeather();
                fetchTransport();
                startTimers();
            } else {
                stopTimers();
            }
        }
    );

    window.addEventListener(
        "orientationchange",
        function () {
            setTimeout(
                function () {
                    window.scrollTo(
                        0,
                        0
                    );
                },
                250
            );
        }
    );

    fetchWeather();
    fetchTransport();
    startTimers();
</script>
