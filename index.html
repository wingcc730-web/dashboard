<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人天氣與交通儀表板</title>
    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --card-border: #ffebee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- 頂部標題列 (參照 image_d64b44.png) --- */
        .top-bar {
            background-color: #ffffff;
            border: 2px dashed var(--pink-border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(255, 230, 232, 0.5);
        }
        .top-bar-left {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }
        .clock-time {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--teal-main);
            font-family: "Arial Black", Arial, sans-serif;
            letter-spacing: 2px;
        }
        .clock-date {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--pink-text);
        }
        .badge-qixi {
            background-color: var(--pink-bg);
            color: var(--pink-text);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 內容網格 --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* --- 卡片通用設定 --- */
        .card {
            background-color: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--card-border);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .update-time {
            font-size: 0.85rem;
            color: #f06c88;
            background-color: #fff2f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        /* --- 天氣區塊 --- */
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .temp-large {
            font-size: 5rem;
            font-weight: bold;
            color: #ffb300;
            line-height: 1;
        }
        .temp-range {
            font-size: 0.95rem;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }
        .weather-icon-large {
            font-size: 4.5rem;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .w-item {
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .w-item.apparent { background: #e6f6f4; color: var(--teal-main); }
        .w-item.apparent span { color: #333; }
        .w-item.uv { background: #ffebee; color: #d81b60; }
        .w-item.uv span { color: #333; }
        .w-item.humidity { background: #e3f2fd; color: #1976d2; }
        .w-item.humidity span { color: #333; }
        .w-item.rain { background: #fff8e1; color: #673ab7; }
        .w-item.rain span { color: #333; }

        /* 天氣預報 (取代原本的逐小時) */
        .forecast-section {
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }
        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 15px;
        }
        .forecast-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .forecast-day {
            flex: 0 0 auto;
            text-align: center;
            background: #fcfcfc;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            min-width: 65px;
        }
        .forecast-day .date { font-size: 0.85rem; color: #555; }
        .forecast-day .week { font-size: 0.85rem; color: #888; margin-bottom: 5px; }
        .forecast-day .temp { font-weight: bold; font-size: 0.95rem; color: #333; }
        .forecast-day .rain { font-size: 0.75rem; color: var(--teal-main); margin-top: 4px; font-weight: bold;}

        /* --- 交通區塊 --- */
        .bus-card {
            border: 2px solid #f5f5f5;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .bus-main {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .bus-route-box {
            background-color: var(--teal-main);
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            margin-right: 15px;
        }
        .bus-info {
            flex-grow: 1;
        }
        .bus-dest {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }
        .bus-stop {
            font-size: 0.85rem;
            color: #e91e63;
            margin-top: 4px;
        }
        .bus-eta {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--teal-main);
            text-align: right;
            min-width: 70px;
        }
        .bus-sub {
            border-top: 2px dashed #f5f5f5;
            padding-top: 12px;
            font-size: 0.95rem;
            color: #666;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sub-pill {
            background-color: #f5f5f5;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            color: #555;
        }
        
        /* 隱藏捲軸美化 */
        ::-webkit-scrollbar { height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eedddf; border-radius: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 頂部標題列 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">--月--日 (-) 🌸</div>
        </div>
        <div class="top-bar-right">
            <div class="badge-qixi">七月初七 ✨ 七夕 🌸</div>
        </div>
    </header>
    
    <main class="content-grid">
        <!-- 左側：天氣區塊 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    ☀️ 屯門 
                    <span style="font-size: 0.8rem; background: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 12px; margin-left: 10px;">🎐 天氣資訊</span>
                </div>
                <div class="update-time" id="weather-update-time">更新時間 : --:--</div>
            </div>
            
            <div class="weather-main">
                <div>
                    <div class="temp-large" id="current-temp">--°</div>
                    <div class="temp-range" id="temp-range">今日預測 : --°C - --°C</div>
                </div>
                <div class="weather-icon-large">🌧️</div>
            </div>
            
            <div class="weather-grid">
                <div class="w-item apparent">
                    <span>🌡️ 體感溫度</span> <span id="apparent-temp">--°C</span>
                </div>
                <div class="w-item uv">
                    <span>☀️ 紫外線指數</span> <span id="current-uv">--</span>
                </div>
                <div class="w-item humidity">
                    <span>💧 相對濕度</span> <span id="current-humidity">--%</span>
                </div>
                <div class="w-item rain">
                    <span>☂️ 降雨概率</span> <span id="rain-prob">--</span>
                </div>
            </div>
            
            <!-- 未來九天預測 -->
            <div class="forecast-section">
                <div class="forecast-header">
                    <div>未來九天天氣預測</div>
                    <div style="font-size:0.8rem; color:#999;">天文台自動數據</div>
                </div>
                <div id="forecast-container" class="forecast-container">
                    <div style="color: #999; font-size: 0.9rem;">載入中...</div>
                </div>
            </div>
        </section>

        <!-- 右側：交通區塊 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">🚌 交通</div>
                <div class="update-time" id="transport-update-time">更新時間 : --:--</div>
            </div>
            <div id="transport-container">
                <div style="color: #999; font-size: 0.9rem;">載入中...</div>
            </div>
        </section>
    </main>
</div>

<script>
    // --- 1. 時鐘與日期邏輯 ---
    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock-time').textContent = `${hh}:${mm}:${ss}`;
        
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const day = days[now.getDay()];
        document.getElementById('clock-date').textContent = `${month}月${date}日 (${day}) 🌸`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. 天氣 API 邏輯 (使用 data.weather.gov.hk) ---
    const HKO_RHRREAD = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
    const HKO_FND = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc";

    async function fetchWeather() {
        try {
            const [resRhr, resFnd] = await Promise.all([ fetch(HKO_RHRREAD), fetch(HKO_FND) ]);
            const dataRhr = await resRhr.json();
            const dataFnd = await resFnd.json();
            
            // 當前溫度 (尋找屯門，若無則用全港平均)
            const tmTemp = dataRhr.temperature.data.find(d => d.place === "屯門")?.value || dataRhr.temperature.data[0].value;
            document.getElementById('current-temp').textContent = `${tmTemp}°`;
            // 由於官方無直接體感溫度 API，簡單預估 (可依需求調整)
            document.getElementById('apparent-temp').textContent = `${(tmTemp + 2.5).toFixed(1)}°C`;
            
            document.getElementById('current-humidity').textContent = `${dataRhr.humidity.data[0].value}%`;
            
            const uv = dataRhr.uvindex ? dataRhr.uvindex.data[0].value : "--";
            const uvDesc = dataRhr.uvindex ? dataRhr.uvindex.data[0].desc : "";
            document.getElementById('current-uv').textContent = `${uv} · ${uvDesc}`;
            
            // 今日預測範圍與降雨機率
            const todayForecast = dataFnd.weatherForecast[0];
            document.getElementById('temp-range').textContent = `今日預測 : ${todayForecast.forecastMintemp.value}°C - ${todayForecast.forecastMaxtemp.value}°C`;
            document.getElementById('rain-prob').textContent = `${todayForecast.PSR}`;
            
            // 渲染未來九天預測
            let forecastHTML = '';
            dataFnd.weatherForecast.slice(0, 8).forEach(day => {
                const d = day.forecastDate.substring(6,8) + "/" + day.forecastDate.substring(4,6);
                forecastHTML += `
                    <div class="forecast-day">
                        <div class="date">${d}</div>
                        <div class="week">${day.week}</div>
                        <div class="temp">${day.forecastMintemp.value}°-${day.forecastMaxtemp.value}°</div>
                        <div class="rain">降雨: ${day.PSR}</div>
                    </div>
                `;
            });
            document.getElementById('forecast-container').innerHTML = forecastHTML;
            
            const nowTime = new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('weather-update-time').textContent = `更新時間 : ${nowTime}`;
        } catch (e) {
            console.error("天氣獲取失敗", e);
            document.getElementById('forecast-container').innerHTML = `<div style="color: #999;">暫時未能取得預測。</div>`;
        }
    }

    // --- 3. 交通 API 邏輯 (九巴修復版) ---
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const busRoutes = [
        { route: "57M", dir: "O", dest: "荔景 (北)", stopName: "業旺邨" },
        { route: "66X", dir: "O", dest: "奧運站", stopName: "聖彼得堂" },
        { route: "66M", dir: "O", dest: "荃灣 (如心廣場)", stopName: "聖彼得堂" },
        { route: "258D", dir: "O", dest: "藍田站", stopName: "聖彼得堂" }
    ];

    async function getKmbStopId(route, dir, targetName) {
        // 修復: 將 O / I 轉為 outbound / inbound 供站點 API 使用
        const apiDir = dir === "O" ? "outbound" : (dir === "I" ? "inbound" : dir);
        const res = await fetch(`${KMB_BASE}/route-stop/${encodeURIComponent(route)}/${apiDir}/1`);
        const data = await res.json();
        const rows = data.data || [];
        const matchStr = targetName.includes("聖彼") ? "聖彼" : targetName;
        const exact = rows.find(x => (x.name_tc||"").includes(matchStr) || (x.name||"").includes(matchStr));
        return exact?.stop || rows[0]?.stop || null;
    }

    async function fetchTransport() {
        try {
            const container = document.getElementById('transport-container');
            container.innerHTML = '';
            
            for (const bus of busRoutes) {
                const stopId = await getKmbStopId(bus.route, bus.dir, bus.stopName);
                let mainEtaHTML = `<span style="font-size:1.5rem; color:#999;">-</span>`;
                let subEtaHTML = `<div class="sub-pill">暫時未能讀取</div>`;
                
                if (stopId) {
                    const etaRes = await fetch(`${KMB_BASE}/eta/${stopId}/${bus.route}/1`);
                    const etaData = await etaRes.json();
                    
                    // 篩選對應方向並計算分鐘數
                    const etas = (etaData.data || [])
                        .filter(x => x.dir === bus.dir && x.eta != null)
                        .sort((a, b) => new Date(a.eta) - new Date(b.eta))
                        .map(x => {
                            const diff = new Date(x.eta) - new Date();
                            return Math.max(0, Math.floor(diff / 60000));
                        });
                    
                    if (etas.length > 0) {
                        const firstEta = etas[0] === 0 ? "即將" : etas[0];
                        mainEtaHTML = `${firstEta} <span style="font-size:1rem; font-weight:normal;">${firstEta === '即將' ? '' : '分鐘'}</span>`;
                        
                        if (etas.length > 1) {
                            subEtaHTML = etas.slice(1).map(e => `<div class="sub-pill">${e} 分鐘</div>`).join("");
                        } else {
                            subEtaHTML = `<span style="margin-left: 5px;">沒有後續班次</span>`;
                        }
                    }
                }
                
                const card = document.createElement('div');
                card.className = 'bus-card';
                card.innerHTML = `
                    <div class="bus-main">
                        <div class="bus-route-box">${bus.route}</div>
                        <div class="bus-info">
                            <div class="bus-dest">往 ${bus.dest}</div>
                            <div class="bus-stop">📍 ${bus.stopName}</div>
                        </div>
                        <div class="bus-eta">${mainEtaHTML}</div>
                    </div>
                    <div class="bus-sub">
                        <span>後續班次：</span> ${subEtaHTML}
                    </div>
                `;
                container.appendChild(card);
            }
            
            const nowTime = new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('transport-update-time').textContent = `更新時間 : ${nowTime}`;
        } catch(e) {
            console.error("交通獲取失敗", e);
        }
    }

    // --- 啟動與定時更新 ---
    fetchWeather();
    fetchTransport();
    setInterval(fetchWeather, 60000);   // 天氣每 1 分鐘更新
    setInterval(fetchTransport, 30000); // 交通每 30 秒更新
</script>

</body>
</html>
