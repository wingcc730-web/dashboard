<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fdf6f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>個人天氣與交通儀表板</title>
    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --kmb-red: #d71920;
            --card-border: #ffebee;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }
        * { box-sizing: border-box; }
        html { min-height: 100%; background: var(--bg-main); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { margin: 0; color: #333; background: var(--bg-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: max(20px, var(--safe-top)) max(20px, var(--safe-right)) max(20px, var(--safe-bottom)) max(20px, var(--safe-left)); min-height: 100vh; overflow-x: hidden; }
        .dashboard { width: 100%; max-width: 1100px; margin: 0 auto; }
        .top-bar { background: #fff; border: 2px dashed var(--pink-border); border-radius: 20px; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(255, 230, 232, 0.5); }
        .top-bar-left { display: flex; align-items: center; gap: 15px; min-width: 0; }
        .clock-time { font-size: 3.2rem; font-weight: 900; color: var(--teal-main); font-family: "Arial Black", Arial, sans-serif; letter-spacing: 2px; line-height: 1; white-space: nowrap; }
        .clock-date { font-size: 1.35rem; font-weight: bold; color: var(--pink-text); white-space: nowrap; }
        .badge-qixi { font-size: 1.1rem; background: var(--pink-bg); color: var(--pink-text); padding: 8px 20px; border-radius: 20px; font-weight: bold; white-space: nowrap; }
        .content-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 20px; align-items: start; }
        .card { background: #fff; border: 2px solid var(--card-border); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02); min-width: 0; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 15px; border-bottom: 2px dashed var(--card-border); margin-bottom: 20px; }
        .card-title { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; gap: 10px; min-width: 0; }
        .weather-label { font-size: 0.8rem; background: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 12px; margin-left: 10px; white-space: nowrap; }
        .update-time { font-size: 0.85rem; color: var(--pink-text); background: #fff2f4; padding: 4px 12px; border-radius: 12px; font-weight: bold; white-space: nowrap; }
        .weather-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .temp-large { font-size: 5rem; font-weight: bold; color: #ffb300; line-height: 1; }
        .temp-range { font-size: 0.95rem; color: #555; font-weight: bold; margin-top: 10px; }
        .weather-icon-large { font-size: 4.5rem; }
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .w-item { padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: bold; font-size: 1.1rem; }
        .w-item.apparent { background: #e6f6f4; }
        .w-item.uv { background: #ffebee; }
        .w-item.humidity { background: #e3f2fd; }
        .w-item.rain { background: #fff8e1; }
        .forecast-section, .calendar-section { border-top: 2px dashed var(--card-border); padding-top: 15px; }
        .calendar-section { margin-top: 20px; }
        .forecast-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 0.95rem; margin-bottom: 15px; }
        .forecast-container { display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .forecast-day { flex: 0 0 auto; text-align: center; background: #fcfcfc; border: 1px solid #f0f0f0; border-radius: 12px; padding: 10px; min-width: 75px; }
        .forecast-day .date { font-size: 0.85rem; font-weight: bold; }
        .forecast-day .icon { font-size: 1.6rem; margin: 6px 0; }
        .forecast-day .temp { font-weight: bold; font-size: 0.9rem; }
        .calendar-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid #f0f0f0; background: #fff; min-height: 280px; }
        .calendar-wrapper iframe { display: block; width: 100%; height: 280px; border: 0; }
        .bus-card { border: 2px solid #f5f5f5; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
        .bus-card:last-child { margin-bottom: 0; }
        .bus-main { display: flex; align-items: center; margin-bottom: 12px; min-width: 0; }
        .bus-route-box { background: var(--teal-main); color: #fff; font-size: 1.3rem; font-weight: bold; padding: 6px 12px; border-radius: 8px; margin-right: 15px; white-space: nowrap; flex-shrink: 0; }
        .bus-route-box.kmb-box { background: var(--kmb-red); }
        .bus-route-box.lrt-box { background: #f39c12; }
        .bus-info { flex: 1; min-width: 0; }
        .bus-dest { font-weight: bold; font-size: 1.1rem; }
        .bus-stop { font-size: 0.85rem; color: #e91e63; margin-top: 4px; }
        .bus-eta-group { flex-shrink: 0; text-align: right; }
        .bus-eta-main { font-size: 1.8rem; font-weight: bold; color: var(--teal-main); white-space: nowrap; }
        .eta-time-tag { background: #e6f6f4; color: var(--teal-main); font-size: 0.95rem; padding: 2px 6px; border-radius: 6px; font-weight: bold; white-space: nowrap; }
        .bus-sub { border-top: 2px dashed #f5f5f5; padding-top: 12px; font-size: 0.95rem; color: #666; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .sub-pill { background: #f5f5f5; padding: 4px 10px; border-radius: 12px; font-weight: bold; color: #555; white-space: nowrap; font-size: 0.9rem; }
        .loading-message { color: #999; font-size: 0.9rem; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #eedddf; border-radius: 10px; }
        @media only screen and (max-width: 800px) {
            body { padding: max(10px, var(--safe-top)) max(10px, var(--safe-right)) max(10px, var(--safe-bottom)) max(10px, var(--safe-left)); }
            .content-grid { grid-template-columns: 1fr; gap: 12px; }
            .top-bar { padding: 14px; margin-bottom: 12px; }
            .clock-time { font-size: 2.2rem; }
            .clock-date { font-size: 1.2rem; }
            .badge-qixi { display: none; }
            .card { padding: 14px; margin-bottom: 12px; }
            .weather-grid { grid-template-columns: 1fr; gap: 10px; }
            .bus-main { align-items: flex-start; }
            .bus-eta-main { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">--月--日 (-) 🌸</div>
        </div>
        <div class="badge-qixi" id="lunar-festival">--</div>
    </header>
    <main class="content-grid">
        <section class="card">
            <div class="card-header">
                <div class="card-title">☀️ 屯門 <span class="weather-label">🎐 天氣資訊</span></div>
                <div class="update-time" id="weather-update-time">更新時間 : --:--</div>
            </div>
            <div class="weather-main">
                <div>
                    <div class="temp-large" id="current-temp">--°</div>
                    <div class="temp-range" id="temp-range">今日預測 : --°C - --°C</div>
                </div>
                <div class="weather-icon-large" id="main-weather-icon">🌧️</div>
            </div>
            <div class="weather-grid">
                <div class="w-item apparent"><span>🌡️ 體感溫度</span><span id="apparent-temp">--°C</span></div>
                <div class="w-item uv"><span>☀️ 紫外線指數</span><span id="current-uv">--</span></div>
                <div class="w-item humidity"><span>💧 相對濕度</span><span id="current-humidity">--%</span></div>
                <div class="w-item rain"><span>☂️ 降雨概率</span><span id="rain-prob">--%</span></div>
            </div>
            <div class="forecast-section">
                <div class="forecast-header"><div>未來七天天氣預測</div><div style="font-size:0.8rem; color:#999;">天文台自動數據</div></div>
                <div id="forecast-container" class="forecast-container"><div class="loading-message">載入中...</div></div>
            </div>
            <div class="calendar-section">
                <div class="forecast-header"><div>📅 Google 日曆行程及香港假期</div></div>
                <div class="calendar-wrapper" id="calendar-wrapper"><div class="loading-message" style="padding:14px;">載入月曆中...</div></div>
            </div>
        </section>
        <section class="card">
            <div class="card-header">
                <div class="card-title">🚌 交通</div>
                <div class="update-time" id="transport-update-time">更新時間 : --:--</div>
            </div>
            <div id="transport-container"><div class="loading-message">載入中...</div></div>
        </section>
    </main>
</div>

<script>
    "use strict";

    // --- 農曆處理演算法 ---
    const lunarInfo = [0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, 0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x05557, 0x06ca0, 0x0b550, 0x1355a, 0x04da0, 0x0a5b0, 0x14a57, 0x052b0, 0x0a930, 0x0e954, 0x06aa0, 0x0ad50, 0x055a6, 0x04b60, 0x0a570, 0x152b6, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x05557, 0x06ca0, 0x0b550, 0x1355a, 0x04da0, 0x0a5b0, 0x14a57, 0x052b0, 0x0a930, 0x0e954, 0x06aa0, 0x0ad50, 0x055a6, 0x04b60, 0x0a570, 0x152b6, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x05557, 0x06ca0, 0x0b550, 0x1355a, 0x04da0, 0x0a5b0, 0x14a57, 0x052b0, 0x0a930, 0x0e954, 0x06aa0, 0x0ad50, 0x055a6, 0x04b60, 0x0a570, 0x152b6, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x05557, 0x06ca0, 0x0b550, 0x1355a, 0x04da0, 0x0a5b0, 0x14a57, 0x052b0, 0x0a930, 0x0e954, 0x06aa0, 0x0ad50, 0x055a6, 0x04b60, 0x0a570, 0x152b6, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c95     function getLunarDate(date) {
        let i, leap = 0, temp = 0;
        let baseDate = new Date(1900, 0, 31);
        let offset = (date - baseDate) / 86400000;
        for (i = 1900; i < 2100 && offset > 0; i++) {
            temp = 348 + 0;
            let m, days = 0;
            for (m = 0x8000; m > 0x8; m >>= 1) days += (lunarInfo[i - 1900] & m) ? 30 : 29;
            offset -= days;
        }
        if (offset < 0) { offset += (lunarInfo[i - 1901] & 0xf); i--; }
        let year = i;
        let leapMonth = (lunarInfo[i - 1900] & 0xf);
        for (i = 1; i < 13 && offset > 0; i++) {
            let days = ((lunarInfo[year - 1900] & (0x10000 >> i)) ? 30 : 29);
            offset -= days;
        }
        if (offset <= 0) { offset += ((lunarInfo[year - 1900] & (0x10000 >> (i - 1))) ? 30 : 29); i--; }
        let month = i;
        let day = offset;
        const monthNames = ["", "正月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "冬月", "臘月"];
        const dayNames = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十", "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
        
        // 節日對照
        const festivals = { "1-1": "農曆新年", "1-15": "元宵節", "5-5": "端午節", "8-15": "中秋節", "9-9": "重陽節" };
        const key = `${month}-${day}`;
        return festivals[key] || `${monthNames[month]}${dayNames[day]}`;
    }

    function getElement(id) { return document.getElementById(id); }
    
    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        const days = ["日", "一", "二", "三", "四", "五", "六"];
        
        getElement("clock-time").textContent = `${hh}:${mm}:${ss}`;
        
        const lunar = getLunarDate(now);
        getElement("clock-date").textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${days[now.getDay()]}) ${lunar} 🌸`;
        getElement("lunar-festival").textContent = lunar + " ✨";
    }

    updateClock();
    setInterval(updateClock, 1000);
    
    // --- 載入日曆與天氣 (維持原樣) ---
    function loadCalendar() {
        const calendarParts = ["https://calendar.google.com/calendar/embed?height=300", "&wkst=1", "&ctz=Asia%2FHong_Kong", "&showTitle=0", "&showNav=1", "&showPrint=0", "&showTabs=0", "&showCalendars=1", "&mode=MONTH", "&src=dc89b4793ace2057fecdec46d4993dd5afe36ad943d15934b7b00a099a2d63f6%40group.calendar.google.com", "&color=%238E24AA", "&src=46b5edaa088a96fb4cf4a2ce028f4fad9be8c6225b65add94502c53809cf63df%40group.calendar.google.com", "&color=%233F51B5", "&src=f438bd70999c821aadcda50f018273bbf83a40495fca259c10d826477a34eaf1%40group.calendar.google.com", "&color=%230B8043", "&src=zh.hong_kong%23holiday%40group.v.calendar.google.com", "&color=%23D50000"];
        const calendarFrame = document.createElement("iframe");
        calendarFrame.src = calendarParts.join("");
        calendarFrame.title = "Google 日曆行程及香港假期";
        calendarFrame.loading = "lazy";
        calendarFrame.setAttribute("frameborder", "0");
        calendarFrame.setAttribute("scrolling", "no");
        getElement("calendar-wrapper").replaceChildren(calendarFrame);
    }
    loadCalendar();
    
    async function fetchWeather() { /* 此處保持您原本的 fetchWeather 邏輯 */ }
    fetchWeather();
</script>

</html>
