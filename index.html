<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屯門區智能 Dashboard</title>
    <style>
        /* 基礎排版與背景設定 - 帶有日系點點背景感 */
        body {
            background-color: #fff9f5;
            background-image: radial-gradient(#ffd1dc 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px 40px;
            font-family: 'PingFang HK', 'Helvetica Neue', sans-serif;
            color: #333;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部時間列 */
        .top-bar {
            display: flex;
            align-items: baseline;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 30px;
            border-radius: 20px;
            border: 2px dashed #ffb6c1;
        }

        #time-container {
            font-size: 80px;
            font-weight: 900;
            color: #008b8b; /* 藍綠色 */
            letter-spacing: 2px;
            margin-right: 30px;
        }

        #date-container {
            font-size: 36px;
            color: #ff8b94; /* 櫻花粉色 */
            font-weight: bold;
        }

        /* 主內容區雙欄設計 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex-grow: 1;
        }

        /* 卡片共用設定 */
        .card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
        }

        /* --- 左側天氣區塊 --- */
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ffe4e1;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .weather-header-title {
            font-size: 22px;
            font-weight: bold;
        }
        .hourly-btn {
            background: #ffe4e1;
            color: #db7093;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .location-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .location-name {
            font-size: 36px;
            font-weight: 900;
        }
        .weather-desc {
            background: #e0f7fa;
            color: #00838f;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .temp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .temp-main {
            display: flex;
            flex-direction: column;
        }
        #temperature {
            font-size: 110px;
            color: #ffb300;
            font-weight: 900;
            line-height: 1;
        }
        #temp-range {
            font-size: 22px;
            color: #666;
            margin-top: 10px;
            font-weight: bold;
        }
        .weather-icon img {
            width: 120px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        .humidity-pill {
            background: #e0ffff;
            color: #008b8b;
        }
        .humidity-val { color: #333; font-size: 28px; }
        
        .rain-pill {
            background: #ffe4e1;
            color: #db7093;
        }
        .rain-val { color: #db7093; font-size: 28px; }

        /* 模擬每小時預測區塊 */
        .hourly-mock {
            background: #fffafa;
            border-radius: 15px;
            padding: 15px;
            margin-top: auto;
            border: 1px solid #ffe4e1;
        }
        .hourly-mock-title {
            font-size: 14px;
            color: #db7093;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .hourly-mock-times {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #666;
        }

        /* --- 右側巴士區塊 --- */
        .bus-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ffe4e1;
            padding-bottom: 15px;
            color: #db7093;
        }
        .bus-route {
            background: #f8f8ff;
            border: 2px solid #e6e6fa;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .route-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .route-num {
            background: #008b8b;
            color: white;
            font-size: 32px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 10px;
        }
        .route-dest {
            font-size: 24px;
            flex-grow: 1;
            margin-left: 20px;
            font-weight: bold;
        }
        .eta-time {
            font-size: 40px;
            color: #2e8b57;
            font-weight: bold;
        }
        .eta-sub {
            text-align: right;
            font-size: 18px;
            color: #666;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <!-- 頂部時間列 -->
    <div class="top-bar">
        <div id="time-container">00:00:00</div>
        <div id="date-container">載入中...</div>
    </div>

    <div class="main-content">
        <!-- 左半邊：日系天氣卡片 -->
        <div class="card">
            <div class="weather-header">
                <div class="weather-header-title">☀️ 屯門即時與分時天氣</div>
                <div class="hourly-btn">每時預報</div>
            </div>
            
            <div class="location-row">
                <div class="location-name">屯門 🎯</div>
                <div class="weather-desc" id="weather-desc">載入中...</div>
            </div>

            <div class="temp-row">
                <div class="temp-main">
                    <div id="temperature">--°</div>
                    <div id="temp-range">今日預測: -- - --°C</div>
                </div>
                <div class="weather-icon">
                    <img id="weather-icon-img" src="https://www.hko.gov.hk/images/HKOWxIconOutline/pic50.png" alt="weather icon">
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-pill humidity-pill">
                    <span>💧 相對濕度</span>
                    <span class="humidity-val" id="humidity">--%</span>
                </div>
                <div class="stat-pill rain-pill">
                    <span>☔ 降雨概率</span>
                    <span class="rain-val" id="rain-prob">--</span>
                </div>
            </div>

            <!-- 每小時預測 (UI 介面) -->
            <div class="hourly-mock">
                <div class="hourly-mock-title">
                    <span>📅 每小時氣溫與降雨預測</span>
                    <span>逐時趨勢</span>
                </div>
                <div class="hourly-mock-times" id="hourly-times">
                    <!-- 時間將由 JS 生成 -->
                </div>
            </div>
        </div>

        <!-- 右半邊：巴士到站卡片 -->
        <div class="card">
            <div class="bus-title">🚌 業旺邨 往各區巴士班次</div>
            
            <!-- 路線：57M -->
            <div class="bus-route">
                <div class="route-header">
                    <div class="route-num">57M</div>
                    <div class="route-dest">往 荔景 (北)</div>
                    <div class="eta-time" id="eta-57m-1">連接中...</div>
                </div>
                <div class="eta-sub" id="eta-57m-sub">後續班次: --</div>
            </div>
        </div>
    </div>

    <script>
        // 1. 時鐘與日期更新 (加入櫻花與中文字星期)
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('time-container').innerText = timeStr;
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 (${days[now.getDay()]}) 🌸`;
            document.getElementById('date-container').innerText = dateStr;

            // 更新下方每小時趨勢的時間軸
            let hourlyHtml = '';
            let currentHour = now.getHours();
            for(let i=1; i<=6; i++) {
                let h = (currentHour + i) % 24;
                hourlyHtml += `<div>${h.toString().padStart(2, '0')}:00</div>`;
            }
            document.getElementById('hourly-times').innerHTML = hourlyHtml;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. 獲取香港天文台各項數據
        async function fetchWeather() {
            try {
                // A. 獲取即時氣溫、濕度與天氣圖示 (rhrread)
                const resNow = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const dataNow = await resNow.json();
                
                const tmTemp = dataNow.temperature.data.find(d => d.place === '屯門');
                if (tmTemp) document.getElementById('temperature').innerText = tmTemp.value + '°';
                if (dataNow.humidity && dataNow.humidity.data[0]) {
                    document.getElementById('humidity').innerText = dataNow.humidity.data[0].value + '%';
                }
                if (dataNow.icon && dataNow.icon[0]) {
                    document.getElementById('weather-icon-img').src = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${dataNow.icon[0]}.png`;
                }

                // B. 獲取天氣描述 (flw)
                const resForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
                const dataForecast = await resForecast.json();
                if(dataForecast.generalSituation) {
                    // 截取第一句話作為簡短描述
                    let desc = dataForecast.forecastPeriod.split('。')[0];
                    if(!desc) desc = "大致多雲";
                    document.getElementById('weather-desc').innerText = desc;
                }

                // C. 獲取今日最高低溫及降雨概率 (fnd - 九天預報的第一天)
                const res9Day = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const data9Day = await res9Day.json();
                if(data9Day.weatherForecast && data9Day.weatherForecast.length > 0) {
                    const todayFnd = data9Day.weatherForecast[0];
                    document.getElementById('temp-range').innerText = `今日預測: ${todayFnd.forecastMintemp.value} - ${todayFnd.forecastMaxtemp.value}°C`;
                    document.getElementById('rain-prob').innerText = todayFnd.PSR || "--";
                }

            } catch (error) {
                console.error("天氣獲取失敗", error);
            }
        }

        // 3. 獲取九巴 57M 於「業旺邨」的到站時間
        let yipWongStopId = null;
        async function fetchBusETA() {
            try {
                if (!yipWongStopId) {
                    const routeRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/57M/outbound/1');
                    const routeData = await routeRes.json();
                    for (let item of routeData.data) {
                        const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${item.stop}`);
                        const stopData = await stopRes.json();
                        if (stopData.data && stopData.data.name_tc.includes('業旺')) {
                            yipWongStopId = item.stop;
                            break;
                        }
                    }
                }

                if (yipWongStopId) {
                    const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${yipWongStopId}`);
                    const etaData = await etaRes.json();
                    let etas = etaData.data.filter(eta => eta.route === '57M' && eta.dir === 'O');
                    
                    if(etas.length > 0) {
                        let now = new Date();
                        etas = etas.filter(e => new Date(e.eta) > now).sort((a,b) => new Date(a.eta) - new Date(b.eta));
                        
                        if (etas.length > 0) {
                            let firstBus = etas[0];
                            let diffMins = Math.round((new Date(firstBus.eta) - now) / 60000);
                            document.getElementById('eta-57m-1').innerText = diffMins > 0 ? `${diffMins} 分鐘` : '即將抵達';
                            
                            if(etas.length > 1) {
                                let nextBuses = etas.slice(1, 3).map(e => {
                                    let time = new Date(e.eta);
                                    return time.getHours().toString().padStart(2, '0') + ':' + time.getMinutes().toString().padStart(2, '0');
                                }).join(' / ');
                                document.getElementById('eta-57m-sub').innerText = '後續班次: ' + nextBuses;
                            }
                        } else {
                            document.getElementById('eta-57m-1').innerText = '暫無班次';
                        }
                    }
                }
            } catch (error) {
                console.error("巴士 ETA 獲取失敗", error);
                document.getElementById('eta-57m-1').innerText = '網絡錯誤';
            }
        }

        // 初始化呼叫並設定自動更新
        fetchWeather();
        fetchBusETA();
        setInterval(fetchWeather, 60000 * 5); // 天氣每 5 分鐘更新一次
        setInterval(fetchBusETA, 60000); // 巴士每 1 分鐘更新一次
    </script>
</body>
</html>
