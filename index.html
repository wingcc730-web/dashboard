<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人天氣與交通儀表板</title>
    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --card-border: #ffebee;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-main); margin: 0; padding: 20px; color: #333; }
        .dashboard { max-width: 1100px; margin: 0 auto; }

        /* --- 頂部標題列 --- */
        .top-bar { background-color: #ffffff; border: 2px dashed var(--pink-border); border-radius: 20px; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(255, 230, 232, 0.5); }
        .top-bar-left { display: flex; align-items: center; gap: 15px; }
        .clock-time { font-size: 3.5rem; font-weight: 900; color: var(--teal-main); font-family: "Arial Black", Arial, sans-serif; letter-spacing: 2px; line-height: 1; }
        .clock-date { font-size: 1.2rem; font-weight: bold; color: var(--pink-text); }
        .badge-qixi { background-color: var(--pink-bg); color: var(--pink-text); padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; }

        /* --- 內容網格 --- */
        .content-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 20px; }
        .card { background-color: #ffffff; border: 2px solid var(--card-border); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 2px dashed var(--card-border); margin-bottom: 20px; }
        .card-title { font-size: 1.3rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .update-time { font-size: 0.85rem; color: #f06c88; background-color: #fff2f4; padding: 4px 12px; border-radius: 12px; font-weight: bold; }

        /* --- 天氣區塊 --- */
        .weather-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .temp-large { font-size: 5rem; font-weight: bold; color: #ffb300; line-height: 1; }
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .w-item { padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1rem; }
        .w-item.rain { background: #e3f2fd; color: #1976d2; }
        
        /* 七天預測 */
        .forecast-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .forecast-day { flex: 0 0 auto; text-align: center; background: #fcfcfc; border: 1px solid #f0f0f0; border-radius: 12px; padding: 10px; min-width: 70px; }
        .forecast-date { font-size: 0.85rem; font-weight: bold; }
        .forecast-icon { font-size: 1.5rem; margin: 5px 0; }
        .forecast-temp { font-size: 0.9rem; font-weight: bold; color: #333; }

        /* --- Google Calendar --- */
        .calendar-section { margin-top: 20px; border-top: 2px dashed var(--card-border); padding-top: 15px; }

        /* --- 交通區塊 --- */
        .bus-card { border: 2px solid #f5f5f5; border-radius: 16px; padding: 15px; margin-bottom: 12px; }
        .bus-main { display: flex; align-items: center; margin-bottom: 10px; }
        .bus-route-box { background-color: var(--teal-main); color: white; font-size: 1.2rem; font-weight: bold; padding: 6px 10px; border-radius: 8px; margin-right: 12px; }
        .bus-eta-group { margin-left: auto; display: flex; align-items: baseline; gap: 6px; }
        .eta-min { background-color: #e0f2f1; color: var(--teal-main); padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 1.3rem; }
        .eta-time { font-size: 0.95rem; color: #666; font-weight: bold; }
        .bus-sub { border-top: 2px dashed #f5f5f5; padding-top: 8px; font-size: 0.9rem; color: #666; display: flex; gap: 8px; flex-wrap: wrap; }
        .sub-pill { background-color: #f5f5f5; padding: 2px 8px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="dashboard">
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">--月--日 (-) 🌸</div>
        </div>
        <div class="badge-qixi">七月初七 ✨ 七夕 🌸</div>
    </header>
    
    <main class="content-grid">
        <section class="card">
            <div class="card-header">
                <div class="card-title">☀️ 屯門 <span style="font-size: 0.8rem; background: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 12px; margin-left: 10px;">🎐 天氣資訊</span></div>
                <div class="update-time" id="weather-update-time">更新時間 : --:--</div>
            </div>
            <div class="weather-main">
                <div class="temp-large" id="current-temp">--°</div>
                <div class="w-item rain" style="width: 120px;"><span>降雨概率</span> <span id="rain-prob">--</span></div>
            </div>
            <div id="forecast-container" class="forecast-container">載入中...</div>
            <div class="calendar-section">
                <div style="margin-bottom:10px; font-weight:bold;">📅 Google 日曆</div>
                <!-- 請將下方 src 的 ID 替換為你自己的 Google 日曆 ID -->
                <iframe src="https://calendar.google.com/calendar/embed?height=300&wkst=1&ctz=Asia/Hong_Kong&showTitle=0&showNav=1&src=月巴Dating的ID&src=Travel的ID&src=Working的ID&src=zh-hk.official#holiday@group.v.calendar.google.com" style="border:0" width="100%" height="280" frameborder="0" scrolling="no"></iframe>
            </div>
        </section>

        <section class="card">
            <div class="card-header"><div class="card-title">🚌 交通</div></div>
            <div id="transport-container">載入中...</div>
        </section>
    </main>
</div>

<script>
    // --- 輔助：天氣圖示 ---
    function getWeatherIcon(iconCode) {
        const icons = { 1: '☀️', 2: '🌤️', 3: '⛅', 4: '☁️', 5: '🌥️', 6: '🌧️', 7: '🌩️', 8: '⛈️', 9: '🌫️' };
        return icons[iconCode] || '🌡️';
    }

    // --- API 邏輯 ---
    async function fetchData() {
        // 天氣
        const resFnd = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc");
        const dataFnd = await resFnd.json();
        
        document.getElementById('current-temp').textContent = `${dataFnd.weatherForecast[0].forecastMaxtemp.value}°`;
        document.getElementById('rain-prob').textContent = dataFnd.weatherForecast[0].PSR;
        
        let forecastHTML = '';
        dataFnd.weatherForecast.slice(0, 7).forEach(day => {
            const date = day.forecastDate.substring(6,8) + "/" + day.forecastDate.substring(4,6);
            forecastHTML += `
                <div class="forecast-day">
                    <div class="forecast-date">${date}(${day.week.substring(2,3)})</div>
                    <div class="forecast-icon">${getWeatherIcon(day.ForecastIcon)}</div>
                    <div class="forecast-temp">${day.forecastMintemp.value}°-${day.forecastMaxtemp.value}°</div>
                </div>
            `;
        });
        document.getElementById('forecast-container').innerHTML = forecastHTML;

        // 交通
        const busRoutes = [
            { route: "57M", dir: "O", dest: "荔景", stop: "業旺邨" },
            { route: "66X", dir: "O", dest: "奧運", stop: "聖彼得堂" },
            { route: "K53S", dir: "O", dest: "屯門站", stop: "置樂花園" } // K53S 範例
        ];
        
        const container = document.getElementById('transport-container');
        container.innerHTML = '';

        for (let bus of busRoutes) {
            try {
                // 簡化版交通顯示
                container.innerHTML += `
                    <div class="bus-card">
                        <div class="bus-main">
                            <div class="bus-route-box">${bus.route}</div>
                            <div><b>往 ${bus.dest}</b><br><small>${bus.stop}</small></div>
                            <div class="bus-eta-group">
                                <span class="eta-min">5分</span>
                                <span class="eta-time">07:36</span>
                            </div>
                        </div>
                        <div class="bus-sub">
                            後續: <span class="sub-pill">17分 (07:48)</span> <span class="sub-pill">28分 (07:59)</span>
                        </div>
                    </div>
                `;
            } catch(e) {}
        }
    }

    // 初始化時鐘與資料
    function updateClock() {
        const now = new Date();
        document.getElementById('clock-time').textContent = now.toLocaleTimeString('zh-HK', {hour12:false});
        document.getElementById('clock-date').textContent = `${now.getMonth()+1}月${now.getDate()}日 (${['日','一','二','三','四','五','六'][now.getDay()]}) 🌸`;
    }
    setInterval(updateClock, 1000);
    updateClock();
    fetchData();
</script>

</body>
</html>
