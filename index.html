<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#fdf6f5">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>個人天氣與交通儀表板</title>

    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --kmb-red: #d71920;
            --card-border: #ffebee;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg-main);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            color: #333;
            background: var(--bg-main);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            padding-top: max(20px, var(--safe-top));
            padding-right: max(20px, var(--safe-right));
            padding-bottom: max(20px, var(--safe-bottom));
            padding-left: max(20px, var(--safe-left));

            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* 頂部標題列 */

        .top-bar {
            background: #fff;
            border: 2px dashed var(--pink-border);
            border-radius: 20px;
            padding: 15px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 10px
                rgba(255, 230, 232, 0.5);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .clock-time {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--teal-main);
            font-family: "Arial Black", Arial, sans-serif;
            letter-spacing: 2px;
            line-height: 1;
            white-space: nowrap;
        }

        /*
         * 公曆日期與農曆標籤使用相同字體大小。
         */
        .clock-date,
        .badge-qixi {
            font-size: 1.1rem;
        }

        .clock-date {
            font-weight: bold;
            color: var(--pink-text);
            white-space: nowrap;
        }

        .badge-qixi {
            background: var(--pink-bg);
            color: var(--pink-text);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 內容網格 */

        .content-grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(0, 0.85fr);

            gap: 20px;
            align-items: start;
        }

        /* 卡片 */

        .card {
            background: #fff;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.02);

            min-width: 0;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            padding-bottom: 15px;
            border-bottom: 2px dashed var(--card-border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: bold;

            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;
        }

        .weather-label {
            font-size: 0.8rem;
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 10px;
            border-radius: 12px;
            margin-left: 10px;
            white-space: nowrap;
        }

        .update-time {
            font-size: 0.85rem;
            color: var(--pink-text);
            background: #fff2f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 天氣 */

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .temp-large {
            font-size: 5rem;
            font-weight: bold;
            color: #ffb300;
            line-height: 1;
        }

        .temp-range {
            font-size: 0.95rem;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }

        .weather-icon-large {
            font-size: 4.5rem;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .w-item {
            padding: 15px;
            border-radius: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;

            font-weight: bold;
            font-size: 1.1rem;
        }

        .w-item.apparent {
            background: #e6f6f4;
        }

        .w-item.uv {
            background: #ffebee;
        }

        .w-item.humidity {
            background: #e3f2fd;
        }

        .w-item.rain {
            background: #fff8e1;
        }

        /* 天氣預報及月曆 */

        .forecast-section,
        .calendar-section {
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }

        .calendar-section {
            margin-top: 20px;
        }

        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .forecast-container {
            display: flex;
            gap: 12px;

            overflow-x: auto;
            overflow-y: hidden;

            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .forecast-day {
            flex: 0 0 auto;
            text-align: center;
            background: #fcfcfc;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            min-width: 75px;
        }

        .forecast-day .date {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .forecast-day .icon {
            font-size: 1.6rem;
            margin: 6px 0;
        }

        .forecast-day .temp {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .calendar-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            background: #fff;
            min-height: 280px;
        }

        .calendar-wrapper iframe {
            display: block;
            width: 100%;
            height: 280px;
            border: 0;
        }

        /* 交通 */

        .bus-card {
            border: 2px solid #f5f5f5;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .bus-card:last-child {
            margin-bottom: 0;
        }

        .bus-main {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            min-width: 0;
        }

        .bus-route-box {
            background: var(--teal-main);
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 15px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /*
         * 九巴專用紅色。
         */
        .bus-route-box.kmb-box {
            background: var(--kmb-red);
        }

        .bus-route-box.lrt-box {
            background: #f39c12;
        }

        .bus-info {
            flex: 1;
            min-width: 0;
        }

        .bus-dest {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .bus-stop {
            font-size: 0.85rem;
            color: #e91e63;
            margin-top: 4px;
        }

        .bus-eta-group {
            flex-shrink: 0;
            text-align: right;
        }

        .bus-eta-main {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--teal-main);
            white-space: nowrap;
        }

        .eta-time-tag {
            background: #e6f6f4;
            color: var(--teal-main);
            font-size: 0.95rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
            white-space: nowrap;
        }

        .bus-sub {
            border-top: 2px dashed #f5f5f5;
            padding-top: 12px;
            font-size: 0.95rem;
            color: #666;

            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .sub-pill {
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .loading-message {
            color: #999;
            font-size: 0.9rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #eedddf;
            border-radius: 10px;
        }

        /* 手機直向 */

        @media only screen and (max-width: 800px) {
            body {
                padding-top: max(10px, var(--safe-top));
                padding-right: max(10px, var(--safe-right));
                padding-bottom: max(10px, var(--safe-bottom));
                padding-left: max(10px, var(--safe-left));
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .top-bar {
                padding: 14px;
                margin-bottom: 12px;
            }

            .clock-time {
                font-size: 2.2rem;
            }

            /*
             * 即使農曆標籤在窄畫面隱藏，
             * 公曆日期仍保留相同的 1.1rem 字體。
             */
            .clock-date {
                font-size: 1.1rem;
            }

            .badge-qixi {
                display: none;
            }

            .card {
                padding: 14px;
                margin-bottom: 12px;
            }

            .weather-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .bus-main {
                align-items: flex-start;
            }

            .bus-eta-main {
                font-size: 1.3rem;
            }
        }

        /* iPhone 橫向資訊板模式 */

        @media only screen
            and (orientation: landscape)
            and (max-height: 500px) {

            html {
                font-size: 13px;
            }

            body {
                padding-top: max(6px, var(--safe-top));
                padding-right: max(8px, var(--safe-right));
                padding-bottom: max(8px, var(--safe-bottom));
                padding-left: max(8px, var(--safe-left));
            }

            .dashboard {
                max-width: none;
            }

            .top-bar {
                padding: 7px 14px;
                margin-bottom: 8px;
                border-radius: 14px;
            }

            .top-bar-left {
                gap: 10px;
            }

            .clock-time {
                font-size: 2rem;
                letter-spacing: 1px;
            }

            /*
             * 橫向模式中，公曆日期與農曆日期同為 0.8rem。
             */
            .clock-date,
            .badge-qixi {
                font-size: 0.8rem;
            }

            .badge-qixi {
                display: block;
                padding: 5px 10px;
            }

            .content-grid {
                grid-template-columns:
                    minmax(0, 1.05fr)
                    minmax(0, 0.95fr);

                gap: 8px;
            }

            .card {
                padding: 9px;
                border-radius: 14px;
                margin-bottom: 8px;
            }

            .card-header {
                padding-bottom: 7px;
                margin-bottom: 8px;
            }

            .card-title {
                font-size: 1rem;
                gap: 4px;
            }

            .weather-label {
                font-size: 0.65rem;
                padding: 3px 6px;
                margin-left: 3px;
            }

            .update-time {
                font-size: 0.65rem;
                padding: 3px 6px;
            }

            .weather-main {
                margin-bottom: 8px;
            }

            .temp-large {
                font-size: 3rem;
            }

            .temp-range {
                font-size: 0.72rem;
                margin-top: 4px;
            }

            .weather-icon-large {
                font-size: 2.8rem;
            }

            .weather-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                margin-bottom: 8px;
            }

            .w-item {
                padding: 7px;
                border-radius: 8px;
                font-size: 0.72rem;
            }

            .forecast-section {
                padding-top: 7px;
            }

            .forecast-header {
                font-size: 0.72rem;
                margin-bottom: 6px;
            }

            .forecast-container {
                gap: 5px;
                padding-bottom: 4px;
            }

            .forecast-day {
                min-width: 55px;
                padding: 5px;
                border-radius: 8px;
            }

            .forecast-day .date {
                font-size: 0.66rem;
            }

            .forecast-day .icon {
                font-size: 1.05rem;
                margin: 2px 0;
            }

            .forecast-day .temp {
                font-size: 0.64rem;
            }

            .calendar-section {
                margin-top: 8px;
                padding-top: 7px;
            }

            .calendar-wrapper,
            .calendar-wrapper iframe {
                height: 170px;
                min-height: 170px;
            }

            .bus-card {
                padding: 7px;
                margin-bottom: 5px;
                border-radius: 10px;
            }

            .bus-main {
                margin-bottom: 5px;
            }

            .bus-route-box {
                font-size: 0.88rem;
                padding: 4px 7px;
                border-radius: 6px;
                margin-right: 7px;
            }

            .bus-dest {
                font-size: 0.75rem;
            }

            .bus-stop {
                font-size: 0.62rem;
                margin-top: 2px;
            }

            .bus-eta-main {
                font-size: 0.92rem;
            }

            .eta-time-tag {
                font-size: 0.64rem;
                padding: 2px 4px;
            }

            .bus-sub {
                padding-top: 5px;
                font-size: 0.62rem;
                gap: 4px;
