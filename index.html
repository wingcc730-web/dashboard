<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#fdf6f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <title>個人天氣與交通儀表板</title>

    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --card-border: #ffebee;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg-main);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            color: #333;
            background: var(--bg-main);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            padding-top: max(20px, var(--safe-top));
            padding-right: max(20px, var(--safe-right));
            padding-bottom: max(20px, var(--safe-bottom));
            padding-left: max(20px, var(--safe-left));

            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            background: #fff;
            border: 2px dashed var(--pink-border);
            border-radius: 20px;
            padding: 15px 30px;
            margin-bottom: 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            box-shadow:
                0 4px 10px
                rgba(255, 230, 232, 0.5);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .clock-time {
            color: var(--teal-main);
            font-family: "Arial Black", Arial, sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            white-space: nowrap;
        }

        .clock-date {
            color: var(--pink-text);
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-qixi {
            color: var(--pink-text);
            background: var(--pink-bg);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .content-grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1.15fr)
                minmax(0, 0.85fr);
            gap: 20px;
            align-items: start;
        }

        .card {
            min-width: 0;
            margin-bottom: 20px;
            padding: 20px;
            background: #fff;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.02);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;

            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--card-border);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .weather-label {
            margin-left: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            color: #1976d2;
            background: #e3f2fd;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .update-time {
            color: var(--pink-text);
            background: #fff2f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .temp-large {
            color: #ffb300;
            font-size: 5rem;
            font-weight: bold;
            line-height: 1;
        }
