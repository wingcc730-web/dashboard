<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人天氣與交通儀表板</title>
    <style>
        :root {
            --bg-main: #fdf6f5;
            --pink-border: #f4b8c8;
            --pink-text: #f06c88;
            --pink-bg: #ffe6e8;
            --teal-main: #008a87;
            --card-border: #ffebee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .dashboard {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- 頂部標題列 --- */
        .top-bar {
            background-color: #ffffff;
            border: 2px dashed var(--pink-border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(255, 230, 232, 0.5);
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .clock-time {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--teal-main);
            font-family: "Arial Black", Arial, sans-serif;
            letter-spacing: 2px;
            line-height: 1;
        }
        .clock-date {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--pink-text);
        }
        .badge-qixi {
            background-color: var(--pink-bg);
            color: var(--pink-text);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- 內容網格 --- */
        .content-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
            gap: 20px;
        }

        /* --- 卡片通用設定 --- */
        .card {
            background-color: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            min-width: 0;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px dashed var(--card-border);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .update-time {
            font-size: 0.85rem;
            color: #f06c88;
            background-color: #fff2f4;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* --- 天氣區塊 --- */
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .temp-large {
            font-size: 5rem;
            font-weight: bold;
            color: #ffb300;
            line-height: 1;
        }
        .temp-range {
            font-size: 0.95rem;
            color: #555;
            font-weight: bold;
            margin-top: 10px;
        }
        .weather-icon-large {
            font-size: 4.5rem;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .w-item {
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .w-item.apparent { background: #e6f6f4; color: var(--teal-main); }
        .w-item.apparent span { color: #333; }
        .w-item.uv { background: #ffebee; color: #d81b60; }
        .w-item.uv span { color: #333; }
        .w-item.humidity { background: #e3f2fd; color: #1976d2; }
        .w-item.humidity span { color: #333; }
        .w-item.rain { background: #fff8e1; color: #673ab7; }
        .w-item.rain span { color: #333; }

        /* 天氣預報 (未來7天) */
        .forecast-section {
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }
        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 15px;
        }
        .forecast-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .forecast-day {
            flex: 0 0 auto;
            text-align: center;
            background: #fcfcfc;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 10px;
            min-width: 75px;
        }
        .forecast-day .date { font-size: 0.85rem; color: #333; font-weight: bold; }
        .forecast-day .icon { font-size: 1.6rem; margin: 6px 0; }
        .forecast-day .temp { font-weight: bold; font-size: 0.9rem; color: #333; }

        /* --- Google Calendar 區塊 --- */
        .calendar-section {
            margin-top: 20px;
            border-top: 2px dashed var(--card-border);
            padding-top: 15px;
        }
        .calendar-wrapper {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #f0f0f0;
            background: #fff;
        }

        /* --- 交通區塊 --- */
        .bus-card {
            border: 2px solid #f5f5f5;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .bus-main {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }
        .bus-route-box {
            background-color: var(--teal-main);
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 15px;
            white-space: nowrap;
        }
        .bus-info {
            flex-grow: 1;
        }
        .bus-dest {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }
        .bus-stop {
            font-size: 0.85rem;
            color: #e91e63;
            margin-top: 4px;
        }
        .bus-eta-group {
            text-align: right;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .bus-eta-main {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--teal-main);
        }
        /* 淺色背景時間標籤，與分鐘數字底部對齊 */
        .eta-time-tag {
            background-color: #e6f6f4;
            color: var(--teal-main);
            font-size: 0.95rem;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
            vertical-align: baseline;
        }
        .bus-sub {
            border-top: 2px dashed #f5f5f5;
            padding-top: 12px;
            font-size: 0.95rem;
            color: #666;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sub-pill {
            background-color: #f5f5f5;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        /* 捲軸美化 */
        ::-webkit-scrollbar { height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #eedddf; border-radius: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 頂部標題列 -->
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">--月--日 (-) 🌸</div>
        </div>
        <div class="top-bar-right">
            <div class="badge-qixi">七月初七 ✨ 七夕 🌸</div>
        </div>
    </header>
    
    <main class="content-grid">
        <!-- 左側：天氣與日曆區塊 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    ☀️ 屯門 
                    <span style="font-size: 0.8rem; background: #e3f2fd; color: #1976d2; padding: 4px 10px; border-radius: 12px; margin-left: 10px;">🎐 天氣資訊</span>
                </div>
                <div class="update-time" id="weather-update-time">更新時間 : --:--</div>
            </div>
            
            <div class="weather-main">
                <div>
                    <div class="temp-large" id="current-temp">--°</div>
                    <div class="temp-range" id="temp-range">今日預測 : --°C - --°C</div>
                </div>
                <div class="weather-icon-large" id="main-weather-icon">🌧️</div>
            </div>
            
            <!-- 天氣 4 格資訊 -->
            <div class="weather-grid">
                <div class="w-item apparent">
                    <span>🌡️ 體感溫度</span> <span id="apparent-temp">--°C</span>
                </div>
                <div class="w-item uv">
                    <span>☀️ 紫外線指數</span> <span id="current-uv">--</span>
                </div>
                <div class="w-item humidity">
                    <span>💧 相對濕度</span> <span id="current-humidity">--%</span>
                </div>
                <div class="w-item rain">
                    <span>☂️ 降雨概率</span> <span id="rain-prob">--%</span>
                </div>
            </div>
            
            <!-- 未來七天預測 -->
            <div class="forecast-section">
                <div class="forecast-header">
                    <div>未來七天天氣預測</div>
                    <div style="font-size:0.8rem; color:#999;">天文台自動數據</div>
                </div>
                <div id="forecast-container" class="forecast-container">
                    <div style="color: #999; font-size: 0.9rem;">載入中...</div>
                </div>
            </div>

            <!-- Google Calendar 區塊 -->
            <div class="calendar-section">
                <div class="forecast-header" style="margin-bottom: 10px;">
                    <div>📅 Google 日曆行程</div>
                    <div style="font-size:0.8rem; color:#999;">月巴Dating / Travel / Working</div>
                </div>
                <div class="calendar-wrapper">
                    <!-- 修正 400 錯誤：使用正確的嵌入格式 (包含香港假日及多曆檢視) -->
                    <iframe src="https://calendar.google.com/calendar/embed?height=280&wkst=1&ctz=Asia%2FHong_Kong&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0&src=zh-hk.official%23holiday%40group.v.calendar.google.com" style="border:0" width="100%" height="260" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>
        </section>

        <!-- 右側：交通區塊 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">🚌 交通</div>
                <div class="update-time" id="transport-update-time">更新時間 : --:--</div>
            </div>
            <div id="transport-container">
                <div style="color: #999; font-size: 0.9rem;">載入中...</div>
            </div>
        </section>
    </main>
</div>

<script>
    // --- 1. 時鐘與日期邏輯 ---
    function updateClock() {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clock-time').textContent = `${hh}:${mm}:${ss}`;
        
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        const day = days[now.getDay()];
        document.getElementById('clock-date').textContent = `${month}月${date}日 (${day}) 🌸`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. 天氣 API 邏輯 ---
    const HKO_RHRREAD = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc";
    const HKO_FND = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc";

    function getWeatherIcon(iconCode) {
        const icons = { 1: '☀️', 2: '🌤️', 3: '⛅', 4: '☁️', 5: '🌥️', 6: '🌧️', 7: '🌩️', 8: '⛈️', 9: '🌫️' };
        return icons[iconCode] || '🌤️';
    }

    async function fetchWeather() {
        try {
            const [resRhr, resFnd] = await Promise.all([ fetch(HKO_RHRREAD), fetch(HKO_FND) ]);
            const dataRhr = await resRhr.json();
            const dataFnd = await resFnd.json();
            
            const tmTemp = dataRhr.temperature.data.find(d => d.place === "屯門")?.value || dataRhr.temperature.data[0].value;
            document.getElementById('current-temp').textContent = `${tmTemp}°`;
            document.getElementById('apparent-temp').textContent = `${(tmTemp + 2.5).toFixed(1)}°C`;
            document.getElementById('current-humidity').textContent = `${dataRhr.humidity.data[0].value}%`;
            
            const uv = dataRhr.uvindex ? dataRhr.uvindex.data[0].value : "--";
            const uvDesc = dataRhr.uvindex ? dataRhr.uvindex.data[0].desc : "";
            document.getElementById('current-uv').textContent = `${uv} ${uvDesc ? '· '+uvDesc : ''}`;
            
            const todayForecast = dataFnd.weatherForecast[0];
            document.getElementById('temp-range').textContent = `今日預測 : ${todayForecast.forecastMintemp.value}°C - ${todayForecast.forecastMaxtemp.value}°C`;
            document.getElementById('rain-prob').textContent = `${todayForecast.PSR || '低'}`;
            
            // 渲染未來 7 天預測 (日期格式 21/08(五)，下方放天氣圖示與溫度，無降雨資訊)
            let forecastHTML = '';
            dataFnd.weatherForecast.slice(0, 7).forEach(day => {
                const dateStr = day.forecastDate.substring(6,8) + "/" + day.forecastDate.substring(4,6);
                const weekStr = day.week.substring(2, 3); // 星期X 取簡字
                forecastHTML += `
                    <div class="forecast-day">
                        <div class="date">${dateStr}(${weekStr})</div>
                        <div class="icon">${getWeatherIcon(day.ForecastIcon)}</div>
                        <div class="temp">${day.forecastMintemp.value}°-${day.forecastMaxtemp.value}°</div>
                    </div>
                `;
            });
            document.getElementById('forecast-container').innerHTML = forecastHTML;
            
            const nowTime = new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('weather-update-time').textContent = `更新時間 : ${nowTime}`;
        } catch (e) {
            console.error("天氣獲取失敗", e);
            document.getElementById('forecast-container').innerHTML = `<div style="color: #999;">暫時未能取得預測。</div>`;
        }
    }

    // --- 3. 交通 API 邏輯 (包含 57M, 66X, 66M, 258D, K53S) ---
    const KMB_BASE = "https://data.etabus.gov.hk/v1/transport/kmb";
    const busRoutes = [
        { route: "57M", dir: "O", dest: "荔景 (北)", stopName: "業旺邨" },
        { route: "66X", dir: "O", dest: "奧運站", stopName: "聖彼得堂" },
        { route: "66M", dir: "O", dest: "荃灣 (如心廣場)", stopName: "聖彼得堂" },
        { route: "258D", dir: "O", dest: "藍田站", stopName: "聖彼得堂" },
        { route: "K53S", dir: "O", dest: "屯門站", stopName: "置樂花園" }
    ];

    async function getKmbStopId(route, dir, targetName) {
        try {
            const apiDir = dir === "O" ? "outbound" : "inbound";
            const res = await fetch(`${KMB_BASE}/route-stop/${encodeURIComponent(route)}/${apiDir}/1`);
            const data = await res.json();
            const rows = data.data || [];
            const matchStr = targetName.includes("聖彼") ? "聖彼" : targetName;
            const exact = rows.find(x => (x.name_tc||"").includes(matchStr));
            return exact?.stop || rows[0]?.stop || null;
        } catch(e) {
            return null;
        }
    }

    function formatEtaTime(etaIso) {
        if (!etaIso) return "";
        const d = new Date(etaIso);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function fetchTransport() {
        try {
            const container = document.getElementById('transport-container');
            container.innerHTML = '';
            
            for (const bus of busRoutes) {
                const stopId = await getKmbStopId(bus.route, bus.dir, bus.stopName);
                let mainEtaHTML = `<span style="font-size:1.4rem; color:#999;">暫時未能讀取</span>`;
                let subEtaHTML = `<span style="font-size:0.9rem;">沒有後續班次</span>`;
                
                if (stopId) {
                    const etaRes = await fetch(`${KMB_BASE}/eta/${stopId}/${bus.route}/1`);
                    const etaData = await etaRes.json();
                    
                    const etas = (etaData.data || [])
                        .filter(x => x.dir === bus.dir && x.eta != null)
                        .sort((a, b) => new Date(a.eta) - new Date(b.eta))
                        .map(x => {
                            const diff = new Date(x.eta) - new Date();
                            const mins = Math.max(0, Math.floor(diff / 60000));
                            const timeStr = formatEtaTime(x.eta);
                            return { mins, timeStr };
                        });
                    
                    if (etas.length > 0) {
                        const first = etas[0];
                        const firstMinText = first.mins === 0 ? "即將" : `${first.mins} 分鐘`;
                        mainEtaHTML = `${firstMinText} <span class="eta-time-tag">${first.timeStr}</span>`;
                        
                        if (etas.length > 1) {
                            subEtaHTML = etas.slice(1).map(e => `<div class="sub-pill">${e.mins}分 (${e.timeStr})</div>`).join("");
                        }
                    }
                }
                
                const card = document.createElement('div');
                card.className = 'bus-card';
                card.innerHTML = `
                    <div class="bus-main">
                        <div class="bus-route-box">${bus.route}</div>
                        <div class="bus-info">
                            <div class="bus-dest">往 ${bus.dest}</div>
                            <div class="bus-stop">📍 ${bus.stopName}</div>
                        </div>
                        <div class="bus-eta-group">
                            <div class="bus-eta-main">${mainEtaHTML}</div>
                        </div>
                    </div>
                    <div class="bus-sub">
                        <span>後續班次：</span> ${subEtaHTML}
                    </div>
                `;
                container.appendChild(card);
            }
            
            const nowTime = new Date().toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('transport-update-time').textContent = `更新時間 : ${nowTime}`;
        } catch(e) {
            console.error("交通獲取失敗", e);
        }
    }

    // --- 啟動與定時更新 ---
    fetchWeather();
    fetchTransport();
    setInterval(fetchWeather, 60000);   
    setInterval(fetchTransport, 30000); 
</script>

</body>
</html>
